name: Centinela C8 OAuth Repr Hardening

on:
  push:
    branches:
      - centinela-engineering/c05-c8-desktop-oauth-boundary-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C8 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Hide authorization URL from dataclass repr
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("app/services/social_oauth.py")
          text = path.read_text(encoding="utf-8")
          old = "    authorization_url: str\n"
          new = "    authorization_url: str = field(repr=False)\n"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif new not in text:
              raise SystemExit("C8 authorization_url dataclass field not found")
          PY
      - name: Validate C8 repr hardening
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q test/services/test_social_oauth.py test/services/test_social_publication.py test/services/test_manual_publication.py test/services/test_product_manual_publication_ui.py
          uv run --no-sync ruff check app/services/social_oauth.py test/services/test_social_oauth.py
          uv run --no-sync python -m py_compile app/services/social_oauth.py
      - name: Commit only OAuth production hardening
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/services/social_oauth.py; then
            echo "C8_REPR_CHANGED=FALSE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/social_oauth.py
          test "$(git diff --cached --name-only)" = "app/services/social_oauth.py"
          git commit -m "auth: keep OAuth authorization state out of repr"
          git push origin HEAD:centinela-engineering/c05-c8-desktop-oauth-boundary-v0.1
