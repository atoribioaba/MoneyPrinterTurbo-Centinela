name: Centinela C3 v1.3.6 Runtime Backport

on:
  push:
    branches:
      - centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Apply exact upstream runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count == 1:
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")
                  return True
              if count == 0 and new in text:
                  return False
              raise SystemExit(f"unexpected replacement count={count} in {path}: {old}")

          video = Path("app/controllers/v1/video.py")
          replace_once(
              video,
              'redis_url = f"redis://:{_redis_password}@{_redis_host}:{_redis_port}/{_redis_db}"',
              'def _build_redis_url(host: str, port: int, db: int, password: str | None) -> str:\n'
              '    auth = f":{password}@" if password else ""\n'
              '    return f"redis://{auth}{host}:{port}/{db}"\n\n\n'
              'redis_url = _build_redis_url(_redis_host, _redis_port, _redis_db, _redis_password)',
          )
          replace_once(
              video,
              '    filename = file_path.stem\n    extension = file_path.suffix\n'
              '    headers = {"Content-Disposition": f"attachment; filename={filename}{extension}"}\n'
              '    return FileResponse(\n        path=video_path,\n        headers=headers,\n'
              '        filename=f"{filename}{extension}",\n        media_type=f"video/{extension[1:]}",\n    )',
              '    filename = file_path.name\n    extension = file_path.suffix\n'
              '    return FileResponse(\n        path=video_path,\n        filename=filename,\n'
              '        media_type=f"video/{extension[1:]}",\n    )',
          )

          main = Path("webui/Main.py")
          replace_once(
              main,
              '_DOWNLOAD_FILENAME_INVALID_PATTERN = re.compile(r\'[<>:"/\\\\|?*\\x00-\\x1f]\')\n',
              '_DOWNLOAD_FILENAME_INVALID_PATTERN = re.compile(r\'[<>:"/\\\\|?*\\x00-\\x1f]\')\n'
              '_WINDOWS_RESERVED_FILENAMES = frozenset(\n'
              '    {"CON", "PRN", "AUX", "NUL"}\n'
              '    | {f"COM{number}" for number in range(1, 10)}\n'
              '    | {f"LPT{number}" for number in range(1, 10)}\n'
              ')\n',
          )
          replace_once(
              main,
              '    if not safe_subject:\n        safe_subject = "video"\n\n'
              '    suffix = f"-{index}" if total > 1 else ""',
              '    if not safe_subject:\n        safe_subject = "video"\n'
              '    if safe_subject.split(".", 1)[0].upper() in _WINDOWS_RESERVED_FILENAMES:\n'
              '        safe_subject = f"_{safe_subject}"\n\n'
              '    suffix = f"-{index}" if total > 1 else ""',
          )
          PY

      - name: Validate focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q \
            test/services/test_controller_video.py \
            test/services/test_upstream_v136_runtime_fixes.py \
            test/services/test_upstream_v136_download_names.py
          uv run --no-sync ruff check \
            app/controllers/v1/video.py \
            webui/Main.py \
            test/services/test_upstream_v136_runtime_fixes.py \
            test/services/test_upstream_v136_download_names.py

      - name: Commit only runtime backports
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- app/controllers/v1/video.py webui/Main.py)"
          if [ -z "$changed" ]; then
            echo "C3_RUNTIME_PATCH_CHANGED=FALSE"
            exit 0
          fi
          printf '%s\n' "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/controllers/v1/video.py webui/Main.py
          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/controllers/v1/video.py|webui/Main.py)$' || true)"
          test -z "$unexpected"
          git commit -m "fix: backport v1.3.6 Redis and download filename behavior"
          git push origin HEAD:centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1
