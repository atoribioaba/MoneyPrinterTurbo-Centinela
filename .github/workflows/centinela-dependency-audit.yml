name: Centinela Dependency Audit

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "test/services/test_moviepy_pillow_compat.py"
      - ".github/workflows/centinela-dependency-audit.yml"
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "requirements.txt"
      - "test/services/test_moviepy_pillow_compat.py"
      - ".github/workflows/centinela-dependency-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Require deterministic lock
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv lock --check

      - name: Install zero-cost baseline
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --no-default-groups --no-extra litellm --no-extra twelvelabs

      - name: Validate security floors
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          from importlib.metadata import version
          from packaging.version import Version

          floors = {
              "click": "8.3.3",
              "cryptography": "50.0.0",
              "GitPython": "3.1.59",
              "pillow": "12.3.0",
              "setuptools": "83.0.0",
              "starlette": "1.3.1",
          }
          for package, minimum in floors.items():
              installed = version(package)
              print(f"A1_SECURITY_FLOOR={package}=={installed} (minimum {minimum})")
              if Version(installed) < Version(minimum):
                  raise SystemExit(f"{package} resolved below security floor")
          PY

      - name: Verify temporary MoviePy/Pillow override compatibility
        shell: bash
        run: |
          set -euo pipefail
          # pytest belongs to the dev group. Add only that locked group for the
          # compatibility smoke; the vulnerability profiles below still exclude
          # dependency groups explicitly.
          uv sync --frozen --no-default-groups --group dev --no-extra litellm --no-extra twelvelabs
          .venv/bin/pytest -q test/services/test_moviepy_pillow_compat.py

      - name: Audit zero-cost baseline
        shell: bash
        run: |
          set -euo pipefail
          uv --preview-features audit-command audit \
            --no-default-groups \
            --no-extra litellm \
            --no-extra twelvelabs

      - name: Audit LiteLLM optional profile separately
        shell: bash
        run: |
          set -euo pipefail
          # uv audit 0.12.10 includes project extras unless disabled. Keep
          # LiteLLM active here and exclude only TwelveLabs.
          uv --preview-features audit-command audit \
            --no-default-groups \
            --no-extra twelvelabs
