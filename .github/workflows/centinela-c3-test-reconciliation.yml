name: Centinela C3 Test Reconciliation

on:
  push:
    branches:
      - centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Load reserved-name constant in AST test
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("test/services/test_webui_task.py"); s=p.read_text(encoding="utf-8"); old="        \"_DOWNLOAD_FILENAME_INVALID_PATTERN\",\n        \"_build_video_download_name\","; new="        \"_DOWNLOAD_FILENAME_INVALID_PATTERN\",\n        \"_WINDOWS_RESERVED_FILENAMES\",\n        \"_build_video_download_name\","; count=s.count(old); assert count == 1, f"expected one AST target block, found {count}"; p.write_text(s.replace(old,new,1), encoding="utf-8")'

      - name: Validate reconciled tests
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q \
            test/services/test_asgi_static_files.py \
            test/services/test_webui_task.py \
            test/services/test_webui_task_history.py \
            test/services/test_upstream_v136_download_names.py \
            test/services/test_asgi_cors.py
          uv run --no-sync ruff check \
            test/services/test_asgi_static_files.py \
            test/services/test_webui_task.py \
            test/services/test_webui_task_history.py

      - name: Commit only reconciled AST test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/services/test_webui_task.py
          test "$(git diff --cached --name-only)" = "test/services/test_webui_task.py"
          git commit -m "test: load Windows reserved filename constant in WebUI snapshot"
          git push origin HEAD:centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1
