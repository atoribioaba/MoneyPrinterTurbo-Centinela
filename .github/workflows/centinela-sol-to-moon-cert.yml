name: Centinela SOL_TO_MOON Cloud Replay

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/cloud-mobile-v0.1

permissions:
  contents: read

concurrency:
  group: centinela-sol-to-moon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sol-to-moon-linux:
    name: SOL_TO_MOON MEDIA 5/5 / Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Record exact commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "CENTINELA_SOL_TO_MOON_COMMIT=${ACTUAL_SHA}" | tee sol-to-moon-commit.txt
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Provision FFmpeg and ffprobe for AstroMedia
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Compile SOL_TO_MOON certification surface
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_selection.py
          app/services/centinela/media_resolver
          test/services/test_sol_to_moon_media_cloud_replay.py

      - name: Ruff SOL_TO_MOON certification surface
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync ruff check
          test/services/test_sol_to_moon_media_cloud_replay.py

      - name: Run SOL_TO_MOON hermetic MEDIA replay
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=sol-to-moon-linux-${{ matrix.python-version }}.xml
          test/services/test_sol_to_moon_media_cloud_replay.py

      - name: Write Linux scenario evidence
        if: always()
        shell: bash
        run: |
          {
            echo "SCENARIO=SOL_TO_MOON"
            echo "COMMIT=${GITHUB_SHA}"
            echo "OS=Linux"
            echo "PYTHON=${{ matrix.python-version }}"
            echo "TARGET_MEDIA_SELECTED=5_OF_5"
            echo "DISTINCT_MEDIA_REQUIRED=5"
            echo "MATERIAL_SELECTOR_FINAL_AUTHORITY=TRUE"
            echo "NO_IRRELEVANT_BROLL=TRUE"
            echo "AI_GENERATION=FALSE"
            echo "AUTO_PUBLICATION=FALSE"
            echo "NETWORK_DISCOVERY=FALSE"
            echo "LOCAL_FINAL_CERTIFICATION_REQUIRED=TRUE"
            echo "HUMAN_REVIEW_REQUIRED=TRUE"
          } > sol-to-moon-status-linux-${{ matrix.python-version }}.txt

      - name: Upload Linux scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-to-moon-media-linux-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            sol-to-moon-linux-${{ matrix.python-version }}.xml
            sol-to-moon-commit.txt
            sol-to-moon-status-linux-${{ matrix.python-version }}.txt
          retention-days: 14

  sol-to-moon-windows:
    name: SOL_TO_MOON MEDIA 5/5 / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Record exact commit
        shell: pwsh
        run: |
          $ActualSha = (git rev-parse HEAD).Trim()
          "CENTINELA_SOL_TO_MOON_COMMIT=$ActualSha" | Tee-Object -FilePath sol-to-moon-commit.txt
          if ($ActualSha -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch" }

      - name: Prepare hermetic canonical E drive
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'centinela-sol-to-moon-e-drive'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          subst E: $Root
          if ($LASTEXITCODE -ne 0) { throw 'subst E: failed' }
          New-Item -ItemType Directory -Force -Path 'E:\IA\AstroMedia' | Out-Null
          if (-not (Test-Path 'E:\IA\AstroMedia')) { throw 'canonical AstroMedia CI path unavailable' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --python 3.11

      - name: Provision FFmpeg and ffprobe for AstroMedia
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg installation failed' }
          $MachinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $UserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$MachinePath;$UserPath;$env:Path"
          ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg unavailable after provisioning' }
          ffprobe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe unavailable after provisioning' }
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile SOL_TO_MOON certification surface
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_selection.py
          app/services/centinela/media_resolver
          test/services/test_sol_to_moon_media_cloud_replay.py

      - name: Run SOL_TO_MOON hermetic MEDIA replay
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=sol-to-moon-windows-3.11.xml
          test/services/test_sol_to_moon_media_cloud_replay.py

      - name: Write Windows scenario evidence
        if: always()
        shell: pwsh
        run: |
          @(
            "SCENARIO=SOL_TO_MOON"
            "COMMIT=$env:GITHUB_SHA"
            "OS=Windows"
            "PYTHON=3.11"
            "TARGET_MEDIA_SELECTED=5_OF_5"
            "DISTINCT_MEDIA_REQUIRED=5"
            "MATERIAL_SELECTOR_FINAL_AUTHORITY=TRUE"
            "NO_IRRELEVANT_BROLL=TRUE"
            "AI_GENERATION=FALSE"
            "AUTO_PUBLICATION=FALSE"
            "NETWORK_DISCOVERY=FALSE"
            "LOCAL_FINAL_CERTIFICATION_REQUIRED=TRUE"
            "HUMAN_REVIEW_REQUIRED=TRUE"
            "CANONICAL_E_DRIVE_IS_CI_TEMPORARY=TRUE"
          ) | Set-Content -Encoding UTF8 sol-to-moon-status-windows-3.11.txt

      - name: Upload Windows scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-to-moon-media-windows-3.11-${{ github.run_id }}
          path: |
            sol-to-moon-windows-3.11.xml
            sol-to-moon-commit.txt
            sol-to-moon-status-windows-3.11.txt
          retention-days: 14

      - name: Remove hermetic E drive
        if: always()
        shell: pwsh
        run: |
          subst E: /D
          if ($LASTEXITCODE -ne 0) { Write-Warning 'subst E: /D returned non-zero' }
