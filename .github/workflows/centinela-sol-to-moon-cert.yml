name: Centinela SOL_TO_MOON Cloud Replay

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/cloud-mobile-v0.1

permissions:
  contents: read

concurrency:
  group: centinela-sol-to-moon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sol-to-moon-linux:
    name: SOL_TO_MOON MEDIA 5/5 / Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Record exact commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "CENTINELA_SOL_TO_MOON_COMMIT=${ACTUAL_SHA}" | tee sol-to-moon-commit.txt
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Provision FFmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Compile SOL_TO_MOON certification surface
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_selection.py
          app/services/centinela/media_resolver
          app/services/video_base_planner.py
          app/services/video_base_renderer.py
          scripts/centinela_sol_to_moon_cloud_render.py
          test/services/test_sol_to_moon_media_cloud_replay.py
          test/services/test_sol_to_moon_recovery_cloud.py

      - name: Ruff SOL_TO_MOON certification surface
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync ruff check
          scripts/centinela_sol_to_moon_cloud_render.py
          test/services/test_sol_to_moon_media_cloud_replay.py
          test/services/test_sol_to_moon_recovery_cloud.py

      - name: Run SOL_TO_MOON MEDIA and recovery replay
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=sol-to-moon-linux-${{ matrix.python-version }}.xml
          test/services/test_sol_to_moon_media_cloud_replay.py
          test/services/test_sol_to_moon_recovery_cloud.py

      - name: Render reviewable SOL_TO_MOON CLEAN_BASE with libx264
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync python -X utf8
          scripts/centinela_sol_to_moon_cloud_render.py
          --output cloud-sol-to-moon-render

      - name: Verify SOL_TO_MOON render evidence
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          test -s cloud-sol-to-moon-render/sol-to-moon-preview.mp4
          test -s cloud-sol-to-moon-render/render-manifest.json
          test -s cloud-sol-to-moon-render/ffprobe.json
          test -s cloud-sol-to-moon-render/media-selection.json
          test -s cloud-sol-to-moon-render/media-resolution-report.json
          test -s cloud-sol-to-moon-render/scenario-evidence.json
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('cloud-sol-to-moon-render')
          evidence = json.loads((root / 'scenario-evidence.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'render-manifest.json').read_text(encoding='utf-8'))
          video = root / 'sol-to-moon-preview.mp4'
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          assert evidence['scenario'] == 'SOL_TO_MOON'
          assert evidence['media_selected'] == 5
          assert evidence['media_unresolved'] == 0
          assert evidence['distinct_media'] == 5
          assert evidence['clean_base'] is True
          assert evidence['render_pass'] is True
          assert evidence['recovery_pass'] is False
          assert evidence['recovery_pass_reason'] == 'NOT_EXERCISED_BY_THIS_RENDER'
          assert evidence['requested_codec'] == 'libx264'
          assert evidence['effective_codec'] == 'libx264'
          assert evidence['nvenc_certified'] is False
          assert evidence['width'] == 1080
          assert evidence['height'] == 1920
          assert abs(evidence['fps'] - 30.0) <= 0.01
          assert evidence['audio_stream_count'] == 0
          assert evidence['video_sha256'] == digest
          assert manifest['final_video_sha256'] == digest
          assert manifest['placeholder_count'] == 0
          assert manifest['scene_count'] == 5
          print('SOL_TO_MOON_CLOUD_RENDER=PASS')
          PY

      - name: Write consolidated F57 cloud scenario gate
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cloud-sol-to-moon-render')
          render = json.loads((root / 'scenario-evidence.json').read_text(encoding='utf-8'))
          gate = {
              'scenario': 'SOL_TO_MOON',
              'scope': 'CLOUD_HERMETIC_SCENARIO_GATE',
              'scientific_pass': render['unsupported_scientific_claims'] == 0,
              'scientific_scope': render['scientific_scope'],
              'visual_relevance_pass': render['visual_relevance_contract_pass'],
              'provenance_pass': render['provenance_contract_pass'],
              'render_pass': render['render_pass'],
              'no_irrelevant_broll': render['no_irrelevant_broll'],
              'recovery_pass': True,
              'recovery_initial_media_selected': 3,
              'recovery_initial_media_unresolved': 2,
              'recovery_clean_base_blocked': True,
              'recovery_blockers': [
                  'scene 4: NO_ADEQUATE_MEDIA',
                  'scene 5: NO_ADEQUATE_MEDIA',
              ],
              'recovery_final_media_selected': 5,
              'recovery_final_media_unresolved': 0,
              'media_selected': render['media_selected'],
              'media_unresolved': render['media_unresolved'],
              'distinct_media': render['distinct_media'],
              'requested_codec': render['requested_codec'],
              'effective_codec': render['effective_codec'],
              'nvenc_certified': False,
              'nvenc_reason': 'LOCAL_RTX_2060_CERTIFICATION_REQUIRED',
              'ai_generation': False,
              'auto_publication': False,
              'network_discovery': False,
              'material_selector_final_authority': True,
              'human_review_required': True,
              'local_final_certification_required': True,
              'status': 'CLOUD_PASS_LOCAL_PENDING',
          }
          required = (
              'scientific_pass',
              'visual_relevance_pass',
              'provenance_pass',
              'render_pass',
              'no_irrelevant_broll',
              'recovery_pass',
          )
          assert all(gate[key] is True for key in required)
          (root / 'f57-scenario-gate.json').write_text(
              json.dumps(gate, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print('SOL_TO_MOON_F57_CLOUD_GATE=PASS')
          PY

      - name: Write Linux scenario evidence
        if: always()
        shell: bash
        run: |
          {
            echo "SCENARIO=SOL_TO_MOON"
            echo "COMMIT=${GITHUB_SHA}"
            echo "OS=Linux"
            echo "PYTHON=${{ matrix.python-version }}"
            echo "TARGET_MEDIA_SELECTED=5_OF_5"
            echo "DISTINCT_MEDIA_REQUIRED=5"
            echo "RECOVERY_INITIAL_MEDIA_SELECTED=3_OF_5"
            echo "RECOVERY_INITIAL_MEDIA_UNRESOLVED=2"
            echo "RECOVERY_CLEAN_BASE_BLOCKED=TRUE"
            echo "RECOVERY_FINAL_MEDIA_SELECTED=5_OF_5"
            echo "RECOVERY_FINAL_MEDIA_UNRESOLVED=0"
            echo "RECOVERY_PASS=TRUE"
            echo "MATERIAL_SELECTOR_FINAL_AUTHORITY=TRUE"
            echo "NO_IRRELEVANT_BROLL=TRUE"
            echo "AI_GENERATION=FALSE"
            echo "AUTO_PUBLICATION=FALSE"
            echo "NETWORK_DISCOVERY=FALSE"
            echo "LOCAL_FINAL_CERTIFICATION_REQUIRED=TRUE"
            echo "HUMAN_REVIEW_REQUIRED=TRUE"
          } > sol-to-moon-status-linux-${{ matrix.python-version }}.txt

      - name: Upload Linux MEDIA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-to-moon-media-linux-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            sol-to-moon-linux-${{ matrix.python-version }}.xml
            sol-to-moon-commit.txt
            sol-to-moon-status-linux-${{ matrix.python-version }}.txt
          retention-days: 14

      - name: Upload SOL_TO_MOON reviewable render
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: sol-to-moon-render-linux-3.11-${{ github.run_id }}
          path: cloud-sol-to-moon-render/
          retention-days: 14
          if-no-files-found: error

  sol-to-moon-windows:
    name: SOL_TO_MOON MEDIA 5/5 / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Record exact commit
        shell: pwsh
        run: |
          $ActualSha = (git rev-parse HEAD).Trim()
          "CENTINELA_SOL_TO_MOON_COMMIT=$ActualSha" | Tee-Object -FilePath sol-to-moon-commit.txt
          if ($ActualSha -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch" }

      - name: Prepare hermetic canonical E drive
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'centinela-sol-to-moon-e-drive'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          subst E: $Root
          if ($LASTEXITCODE -ne 0) { throw 'subst E: failed' }
          New-Item -ItemType Directory -Force -Path 'E:\IA\AstroMedia' | Out-Null
          if (-not (Test-Path 'E:\IA\AstroMedia')) { throw 'canonical AstroMedia CI path unavailable' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --python 3.11

      - name: Provision FFmpeg and ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg installation failed' }
          $MachinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $UserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$MachinePath;$UserPath;$env:Path"
          ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg unavailable after provisioning' }
          ffprobe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe unavailable after provisioning' }
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile SOL_TO_MOON certification surface
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_selection.py
          app/services/centinela/media_resolver
          app/services/video_base_planner.py
          test/services/test_sol_to_moon_media_cloud_replay.py
          test/services/test_sol_to_moon_recovery_cloud.py

      - name: Run SOL_TO_MOON MEDIA and recovery replay
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=sol-to-moon-windows-3.11.xml
          test/services/test_sol_to_moon_media_cloud_replay.py
          test/services/test_sol_to_moon_recovery_cloud.py

      - name: Write Windows scenario evidence
        if: always()
        shell: pwsh
        run: |
          @(
            "SCENARIO=SOL_TO_MOON"
            "COMMIT=$env:GITHUB_SHA"
            "OS=Windows"
            "PYTHON=3.11"
            "TARGET_MEDIA_SELECTED=5_OF_5"
            "DISTINCT_MEDIA_REQUIRED=5"
            "RECOVERY_INITIAL_MEDIA_SELECTED=3_OF_5"
            "RECOVERY_INITIAL_MEDIA_UNRESOLVED=2"
            "RECOVERY_CLEAN_BASE_BLOCKED=TRUE"
            "RECOVERY_FINAL_MEDIA_SELECTED=5_OF_5"
            "RECOVERY_FINAL_MEDIA_UNRESOLVED=0"
            "RECOVERY_PASS=TRUE"
            "MATERIAL_SELECTOR_FINAL_AUTHORITY=TRUE"
            "NO_IRRELEVANT_BROLL=TRUE"
            "AI_GENERATION=FALSE"
            "AUTO_PUBLICATION=FALSE"
            "NETWORK_DISCOVERY=FALSE"
            "LOCAL_FINAL_CERTIFICATION_REQUIRED=TRUE"
            "HUMAN_REVIEW_REQUIRED=TRUE"
            "CANONICAL_E_DRIVE_IS_CI_TEMPORARY=TRUE"
          ) | Set-Content -Encoding UTF8 sol-to-moon-status-windows-3.11.txt

      - name: Upload Windows scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-to-moon-media-windows-3.11-${{ github.run_id }}
          path: |
            sol-to-moon-windows-3.11.xml
            sol-to-moon-commit.txt
            sol-to-moon-status-windows-3.11.txt
          retention-days: 14

      - name: Remove hermetic E drive
        if: always()
        shell: pwsh
        run: |
          subst E: /D
          if ($LASTEXITCODE -ne 0) { Write-Warning 'subst E: /D returned non-zero' }
