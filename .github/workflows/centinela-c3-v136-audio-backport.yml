name: Centinela C3 v1.3.6 Audio Timing Backport

on:
  push:
    branches:
      - centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Apply exact audio timing fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          task = Path("app/services/task.py")
          text = task.read_text(encoding="utf-8")
          old = '        audio_duration = math.ceil(voice.get_audio_duration(sub_maker))'
          new = (
              '        file_duration = voice.get_audio_duration(audio_file)\n'
              '        audio_duration = math.ceil(\n'
              '            file_duration if file_duration > 0 else voice.get_audio_duration(sub_maker)\n'
              '        )'
          )
          count = text.count(old)
          if count == 1:
              text = text.replace(old, new, 1)
              task.write_text(text, encoding="utf-8")
          elif count != 0 or new not in text:
              raise SystemExit(f"unexpected task duration replacement count={count}")

          voice = Path("app/services/voice.py")
          text = voice.read_text(encoding="utf-8")
          start_marker = '                # 获取音频文件的实际长度\n                try:\n'
          end_marker = '                logger.success(f"siliconflow tts succeeded: {voice_file}")'
          desired_marker = '                return populate_legacy_submaker_with_full_text('

          if desired_marker not in text[text.find('def siliconflow_tts('):text.find('def _build_azure_v2_ssml(')]:
              start = text.find(start_marker, text.find('def siliconflow_tts('))
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit("siliconflow timing markers not found")
              replacement = (
                  '                try:\n'
                  '                    audio_clip = AudioFileClip(voice_file)\n'
                  '                    try:\n'
                  '                        audio_duration = audio_clip.duration\n'
                  '                    finally:\n'
                  '                        audio_clip.close()\n'
                  '                except Exception as e:\n'
                  '                    logger.warning(f"Failed to read audio duration: {str(e)}")\n'
                  '                    audio_duration = 10.0\n\n'
                  '                logger.success(f"siliconflow tts succeeded: {voice_file}")\n'
                  '                return populate_legacy_submaker_with_full_text(\n'
                  '                    sub_maker=sub_maker,\n'
                  '                    text=text,\n'
                  '                    audio_duration_seconds=audio_duration,\n'
                  '                )\n'
              )
              after = end + len(end_marker)
              # Remove the old logger.debug + return sub_maker block too.
              old_tail_end = text.find('            else:\n', after)
              if old_tail_end < 0:
                  raise SystemExit("siliconflow success-tail marker not found")
              text = text[:start] + replacement + text[old_tail_end:]
              voice.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused audio regressions
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q \
            test/services/test_upstream_v136_audio_timing.py \
            test/services/test_voice.py \
            test/services/test_task.py
          uv run --no-sync ruff check \
            app/services/task.py \
            app/services/voice.py \
            test/services/test_upstream_v136_audio_timing.py

      - name: Commit only audio timing backports
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- app/services/task.py app/services/voice.py)"
          if [ -z "$changed" ]; then
            echo "C3_AUDIO_PATCH_CHANGED=FALSE"
            exit 0
          fi
          printf '%s\n' "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/task.py app/services/voice.py
          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/services/task.py|app/services/voice.py)$' || true)"
          test -z "$unexpected"
          git commit -m "fix: backport v1.3.6 audio duration and subtitle timing"
          git push origin HEAD:centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1
