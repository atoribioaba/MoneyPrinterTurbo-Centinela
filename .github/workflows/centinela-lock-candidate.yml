name: Centinela Lock Candidate

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: centinela-lock-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-lock-candidate:
    name: Generate uv.lock candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head exactly
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Generate deterministic lock candidate
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv lock
          uv lock --check
          sha256sum uv.lock > uv.lock.sha256
          echo "LOCK_CANDIDATE_GENERATION=PASS"

      - name: Upload lock candidate only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centinela-uv-lock-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            uv.lock
            uv.lock.sha256
          retention-days: 1
          if-no-files-found: error
