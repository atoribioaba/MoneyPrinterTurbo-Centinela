name: Centinela C16 FactLock Semantic Hardening V3

on:
  push:
    branches:
      - centinela-engineering/c05-c16-factlock-semantic-integrity-v0.1

permissions:
  contents: write

jobs:
  harden-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out C16
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Reapply C16 patch and correct test expectation
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/centinela-c16-factlock-semantic-hardening.yml").read_text(encoding="utf-8")
          start = "      - name: Apply C16 FactLock semantic hardening\n        shell: python\n        run: |\n"
          end = "      - name: Install locked dev environment\n"
          if start not in source or end not in source:
              raise SystemExit("source C16 patch block not found")
          block = source.split(start, 1)[1].split(end, 1)[0]
          code = textwrap.dedent(block)
          exec(compile(code, "<c16-patch>", "exec"), {"__name__": "__main__"})

          test = Path("test/services/test_factlock_semantic_integrity.py")
          text = test.read_text(encoding="utf-8")
          old_param = '@pytest.mark.parametrize("context_hash", ["a" * 64, "A" * 63, "Z" * 64])'
          new_param = '@pytest.mark.parametrize("context_hash", ["a" * 64, "Z" * 64])'
          if old_param not in text:
              raise SystemExit("C16 hash parameter anchor missing")
          text = text.replace(old_param, new_param, 1)
          anchor = 'def test_fact_lock_rejects_fact_mutation_with_stale_hash() -> None:\n'
          extra = 'def test_fact_lock_rejects_wrong_hash_length() -> None:\n    payload = _payload()\n    payload["context_hash"] = "A" * 63\n    with pytest.raises(ValidationError):\n        FactLock.model_validate(payload)\n\n\n'
          if anchor not in text:
              raise SystemExit("C16 wrong-length insertion anchor missing")
          text = text.replace(anchor, extra + anchor, 1)
          test.write_text(text, encoding="utf-8")
      - name: Install locked dev environment
        run: uv sync --frozen --group dev --python 3.11
      - name: Run focused C16 regressions
        run: |
          uv run --python 3.11 pytest -q \
            test/services/test_factlock_semantic_integrity.py \
            test/services/test_writer_room.py
      - name: Ruff changed Python files
        run: |
          uv run --python 3.11 ruff check \
            app/services/centinela/writer_room/models.py \
            app/services/centinela/writer_room/__init__.py \
            app/services/centinela/writer_room/spine_adapter.py \
            app/services/centinela/writer_room/room.py \
            test/services/test_writer_room.py \
            test/services/test_factlock_semantic_integrity.py
      - name: Compile changed Python files
        run: |
          uv run --python 3.11 python -m py_compile \
            app/services/centinela/writer_room/models.py \
            app/services/centinela/writer_room/__init__.py \
            app/services/centinela/writer_room/spine_adapter.py \
            app/services/centinela/writer_room/room.py \
            test/services/test_writer_room.py \
            test/services/test_factlock_semantic_integrity.py
      - name: Commit only C16 functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/centinela/writer_room/models.py \
            app/services/centinela/writer_room/__init__.py \
            app/services/centinela/writer_room/spine_adapter.py \
            app/services/centinela/writer_room/room.py \
            test/services/test_writer_room.py \
            test/services/test_factlock_semantic_integrity.py
          git diff --cached --quiet && exit 0
          mapfile -t files < <(git diff --cached --name-only)
          test "${#files[@]}" -eq 6
          git commit -m "hardening: make FactLock semantically self-verifying"
          git push
