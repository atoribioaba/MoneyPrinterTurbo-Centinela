name: Centinela C4 Upload-Post Config Cleanup

on:
  push:
    branches:
      - centinela-engineering/c05-c4-upload-post-manual-fallback-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Remove misleading auto-publish example
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("config.example.toml")
          text = path.read_text(encoding="utf-8")
          old = '''# Upload-Post can publish generated videos to TikTok, Instagram, and YouTube.
# Create an account and API key at https://upload-post.com/
# API documentation: https://docs.upload-post.com/
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
# Available values: "tiktok", "instagram", "youtube".
upload_post_platforms = ["tiktok", "instagram"]
# Automatically publish successful video outputs after generation.
upload_post_auto_upload = false
# YouTube privacy: "public", "unlisted", or "private".
upload_post_youtube_privacy_status = "public"
'''
          new = '''# Optional legacy/fallback aggregator. Direct official YouTube, TikTok and
# Instagram adapters are the canonical Centinela publication path.
# Upload-Post is never invoked automatically: every upload requires explicit
# human approval at the service boundary. Configuration is not approval.
# Service: https://upload-post.com/ | API docs: https://docs.upload-post.com/
upload_post_enabled = false
upload_post_api_key = ""
upload_post_username = ""
# Available values: "tiktok", "instagram", "youtube".
upload_post_platforms = ["tiktok", "instagram"]
# Manual YouTube fallback defaults to the safest visibility.
# Available values: "private", "unlisted", or "public".
upload_post_youtube_privacy_status = "private"
'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          elif "upload_post_auto_upload" in text:
              raise SystemExit("Upload-Post config block changed unexpectedly")
          elif 'upload_post_youtube_privacy_status = "private"' not in text:
              raise SystemExit("Upload-Post config cleanup is neither pending nor applied")
          PY

      - name: Validate C4 regressions
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q test/services/test_upload_post.py
          uv run --no-sync ruff check app/services/upload_post.py test/services/test_upload_post.py
          if grep -q '^upload_post_auto_upload' config.example.toml; then
            echo 'legacy auto-upload setting still present' >&2
            exit 1
          fi
          grep -q '^upload_post_youtube_privacy_status = "private"$' config.example.toml

      - name: Commit only config cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config.example.toml; then
            echo "C4_CONFIG_CHANGED=FALSE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.example.toml
          test "$(git diff --cached --name-only)" = "config.example.toml"
          git commit -m "docs: remove legacy Upload-Post auto-publish setting"
          git push origin HEAD:centinela-engineering/c05-c4-upload-post-manual-fallback-v0.1
