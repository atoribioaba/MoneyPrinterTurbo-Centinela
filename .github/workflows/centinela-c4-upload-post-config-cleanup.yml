name: Centinela C4 Upload-Post Config Cleanup

on:
  push:
    branches:
      - centinela-engineering/c05-c4-upload-post-manual-fallback-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Remove misleading auto-publish example
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("config.example.toml")
          lines = path.read_text(encoding="utf-8").splitlines()
          output = []
          in_upload_post = False
          replaced_intro = False

          for line in lines:
              if line == "# Upload-Post can publish generated videos to TikTok, Instagram, and YouTube.":
                  in_upload_post = True
                  replaced_intro = True
                  output.extend([
                      "# Optional legacy/fallback aggregator. Direct official YouTube, TikTok and",
                      "# Instagram adapters are the canonical Centinela publication path.",
                      "# Upload-Post is never invoked automatically: every upload requires explicit",
                      "# human approval at the service boundary. Configuration is not approval.",
                  ])
                  continue
              if in_upload_post and line in {
                  "# Create an account and API key at https://upload-post.com/",
                  "# API documentation: https://docs.upload-post.com/",
              }:
                  if line.startswith("# API documentation"):
                      output.append("# Service: https://upload-post.com/ | API docs: https://docs.upload-post.com/")
                  continue
              if in_upload_post and line == "# Automatically publish successful video outputs after generation.":
                  continue
              if in_upload_post and line.startswith("upload_post_auto_upload"):
                  continue
              if in_upload_post and line == '# YouTube privacy: "public", "unlisted", or "private".':
                  output.extend([
                      "# Manual YouTube fallback defaults to the safest visibility.",
                      '# Available values: "private", "unlisted", or "public".',
                  ])
                  continue
              if in_upload_post and line.startswith("upload_post_youtube_privacy_status"):
                  output.append('upload_post_youtube_privacy_status = "private"')
                  in_upload_post = False
                  continue
              output.append(line)

          if not replaced_intro and any(
              line.startswith("upload_post_auto_upload") for line in lines
          ):
              raise SystemExit("Upload-Post config block changed unexpectedly")
          if not any(
              line == 'upload_post_youtube_privacy_status = "private"'
              for line in output
          ):
              raise SystemExit("safe Upload-Post privacy default was not produced")
          if any(line.startswith("upload_post_auto_upload") for line in output):
              raise SystemExit("legacy auto-upload setting was not removed")

          path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY

      - name: Validate C4 regressions
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q test/services/test_upload_post.py
          uv run --no-sync ruff check app/services/upload_post.py test/services/test_upload_post.py
          if grep -q '^upload_post_auto_upload' config.example.toml; then
            echo 'legacy auto-upload setting still present' >&2
            exit 1
          fi
          grep -q '^upload_post_youtube_privacy_status = "private"$' config.example.toml

      - name: Commit only config cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- config.example.toml; then
            echo "C4_CONFIG_CHANGED=FALSE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.example.toml
          test "$(git diff --cached --name-only)" = "config.example.toml"
          git commit -m "docs: remove legacy Upload-Post auto-publish setting"
          git push origin HEAD:centinela-engineering/c05-c4-upload-post-manual-fallback-v0.1
