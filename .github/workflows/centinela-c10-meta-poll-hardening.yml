name: Centinela C10 Meta Poll Hardening

on:
  push:
    branches:
      - centinela-engineering/c05-c10-instagram-ephemeral-https-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C10
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Apply current Meta polling guidance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/services/instagram_ephemeral_https.py")
          text = path.read_text(encoding="utf-8")
          old = '''_DEFAULT_PROCESSING_TIMEOUT_SECONDS = 15 * 60.0\n_DEFAULT_POLL_INTERVAL_SECONDS = 2.0\n_DEFAULT_HTTP_TIMEOUT = (15.0, 120.0)\n'''
          new = '''_DEFAULT_PROCESSING_TIMEOUT_SECONDS = 5 * 60.0\n_DEFAULT_POLL_INTERVAL_SECONDS = 60.0\n_MAX_STATUS_CHECKS = 5\n_DEFAULT_HTTP_TIMEOUT = (15.0, 120.0)\n'''
          if old not in text:
              raise SystemExit("C10 polling constants anchor not found")
          text = text.replace(old, new, 1)

          old = '''    if processing_timeout_seconds <= 0 or poll_interval_seconds <= 0:\n        raise ValueError("processing timeout and poll interval must be positive")\n'''
          new = '''    if not 0 < processing_timeout_seconds <= _DEFAULT_PROCESSING_TIMEOUT_SECONDS:\n        raise ValueError("processing_timeout_seconds must be > 0 and <= 300")\n    if poll_interval_seconds < _DEFAULT_POLL_INTERVAL_SECONDS:\n        raise ValueError("poll_interval_seconds must be >= 60")\n'''
          if old not in text:
              raise SystemExit("C10 polling validation anchor not found")
          text = text.replace(old, new, 1)

          old = '''                deadline = time.monotonic() + processing_timeout_seconds\n                status = adapter.get_container_status(\n                    container_id,\n                    access_token=token,\n                )\n                while status.status == "IN_PROGRESS" and time.monotonic() < deadline:\n                    sleep(poll_interval_seconds)\n                    status = adapter.get_container_status(\n                        container_id,\n                        access_token=token,\n                    )\n'''
          new = '''                deadline = time.monotonic() + processing_timeout_seconds\n                status = adapter.get_container_status(\n                    container_id,\n                    access_token=token,\n                )\n                status_checks = 1\n                while (\n                    status.status == "IN_PROGRESS"\n                    and status_checks < _MAX_STATUS_CHECKS\n                    and time.monotonic() < deadline\n                ):\n                    sleep(poll_interval_seconds)\n                    status = adapter.get_container_status(\n                        container_id,\n                        access_token=token,\n                    )\n                    status_checks += 1\n'''
          if old not in text:
              raise SystemExit("C10 polling loop anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          test_path = Path("test/services/test_instagram_ephemeral_https.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace("poll_interval_seconds=0.01,", "poll_interval_seconds=60,", 2)
          marker = '''def test_c10_source_has_no_secret_persistence_or_auto_publish():\n'''
          extra = '''def test_meta_polling_contract_is_rate_limit_conservative():\n    with pytest.raises(ValueError, match="<= 300"):\n        prepare_instagram_reel(\n            object(),\n            "project-c10",\n            ig_user_id="123",\n            access_token="token",\n            approved=True,\n            environ=_enabled_env(),\n            processing_timeout_seconds=301,\n        )\n\n    with pytest.raises(ValueError, match=">= 60"):\n        prepare_instagram_reel(\n            object(),\n            "project-c10",\n            ig_user_id="123",\n            access_token="token",\n            approved=True,\n            environ=_enabled_env(),\n            poll_interval_seconds=59,\n        )\n\n\n'''
          if extra not in tests:
              if marker not in tests:
                  raise SystemExit("C10 test insertion anchor not found")
              tests = tests.replace(marker, extra + marker, 1)
          test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Validate C10 hardening
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --python 3.11
          uv run --python 3.11 pytest -q test/services/test_instagram_ephemeral_https.py test/services/test_social_publication.py test/services/test_manual_publication.py
          uv run --python 3.11 ruff check app/services/instagram_ephemeral_https.py test/services/test_instagram_ephemeral_https.py
          uv run --python 3.11 python -m py_compile app/services/instagram_ephemeral_https.py
      - name: Commit only C10 production and tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/instagram_ephemeral_https.py test/services/test_instagram_ephemeral_https.py
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "app/services/instagram_ephemeral_https.py test/services/test_instagram_ephemeral_https.py "
          git commit -m "instagram: align container polling with Meta guidance"
          git push
