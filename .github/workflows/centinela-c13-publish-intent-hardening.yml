name: Centinela C13 Publish Intent Hardening

on:
  push:
    branches:
      - centinela-engineering/c05-c13-instagram-product-manual-publication-v0.1

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C13
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Harden durable publish intent and Product UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path("app/services/instagram_manual_publication.py")
          text = service.read_text(encoding="utf-8")

          old = 'INSTAGRAM_PUBLISH_RECEIPT_ARTIFACT_TYPE = "instagram_publish_receipt"\n'
          new = old + 'INSTAGRAM_PUBLISH_INTENT_ARTIFACT_TYPE = "instagram_publish_intent"\n'
          if old not in text:
              raise SystemExit("intent constant anchor missing")
          text = text.replace(old, new, 1)

          old = '''@dataclass(frozen=True, slots=True)\nclass InstagramPublishReceipt:\n    artifact_id: str\n    prepared_artifact_id: str\n    remote_id: str\n    status: str\n\n\ndef _error(\n'''
          new = '''@dataclass(frozen=True, slots=True)\nclass InstagramPublishReceipt:\n    artifact_id: str\n    prepared_artifact_id: str\n    remote_id: str\n    status: str\n\n\n@dataclass(frozen=True, slots=True)\nclass InstagramPublishIntent:\n    artifact_id: str\n    prepared_artifact_id: str\n    container_id: str\n\n\ndef _error(\n'''
          if old not in text:
              raise SystemExit("intent dataclass anchor missing")
          text = text.replace(old, new, 1)

          anchor = '''def get_instagram_publish_receipt(\n    store: ArtifactStore,\n    project_id: str,\n) -> InstagramPublishReceipt | None:\n'''
          helper = '''def _intent_for_prepared(\n    store: ArtifactStore,\n    project_id: str,\n    prepared_artifact_id: str,\n) -> InstagramPublishIntent | None:\n    refs = store.list_artifacts(project_id, artifact_type=INSTAGRAM_PUBLISH_INTENT_ARTIFACT_TYPE)\n    for ref in reversed(refs):\n        payload = store.read_json(project_id, ref.artifact_id, verify_integrity=True)\n        if not isinstance(payload, dict):\n            continue\n        if str(payload.get("prepared_artifact_id") or "") != prepared_artifact_id:\n            continue\n        if payload.get("schema_version") != _SCHEMA_VERSION:\n            continue\n        if payload.get("status") != "STARTED":\n            continue\n        if payload.get("contains_credentials") is not False or payload.get("auto_publication") is not False:\n            raise _error(\n                "instagram_publish_intent_policy_violation",\n                ErrorCategory.VALIDATION,\n                "El intento de publicación de Instagram viola la política de seguridad.",\n                operation="instagram_manual_publication.load_intent",\n            )\n        return InstagramPublishIntent(\n            artifact_id=ref.artifact_id,\n            prepared_artifact_id=prepared_artifact_id,\n            container_id=str(payload.get("container_id") or "").strip(),\n        )\n    return None\n\n\ndef get_unresolved_instagram_publish_intent(\n    store: ArtifactStore,\n    project_id: str,\n) -> InstagramPublishIntent | None:\n    prepared = load_latest_prepared_instagram_reel(store, project_id)\n    if prepared is None:\n        return None\n    if _receipt_for_prepared(store, project_id, prepared.artifact_id) is not None:\n        return None\n    return _intent_for_prepared(store, project_id, prepared.artifact_id)\n\n\n'''
          if anchor not in text:
              raise SystemExit("receipt public helper anchor missing")
          text = text.replace(anchor, helper + anchor, 1)

          old = '''    if _receipt_for_prepared(store, project_id, record.artifact_id) is not None:\n        raise _error(\n            "instagram_prepared_container_already_published",\n            ErrorCategory.VALIDATION,\n            "Este contenedor Instagram ya tiene un recibo de publicación y no se repetirá.",\n            operation="instagram_manual_publication.publish",\n        )\n\n    _package_matches_prepared(store, record.prepared)\n'''
          new = '''    if _receipt_for_prepared(store, project_id, record.artifact_id) is not None:\n        raise _error(\n            "instagram_prepared_container_already_published",\n            ErrorCategory.VALIDATION,\n            "Este contenedor Instagram ya tiene un recibo de publicación y no se repetirá.",\n            operation="instagram_manual_publication.publish",\n        )\n    if _intent_for_prepared(store, project_id, record.artifact_id) is not None:\n        raise _error(\n            "instagram_publish_outcome_unresolved",\n            ErrorCategory.VALIDATION,\n            (\n                "Existe un intento previo de media_publish sin recibo final verificable. "\n                "No se repetirá: comprueba primero el estado remoto en Instagram."\n            ),\n            operation="instagram_manual_publication.publish",\n        )\n\n    _package_matches_prepared(store, record.prepared)\n'''
          if old not in text:
              raise SystemExit("publish preflight anchor missing")
          text = text.replace(old, new, 1)

          old = '''        if user_id != record.prepared.ig_user_id:\n            raise _error(\n                "instagram_publish_account_mismatch",\n                ErrorCategory.AUTH,\n                "La segunda autenticación pertenece a otra cuenta de Instagram.",\n                operation="instagram_manual_publication.publish",\n            )\n        result = publish(\n            store,\n            record.prepared,\n            access_token=access_token,\n            approved=True,\n        )\n'''
          new = '''        if user_id != record.prepared.ig_user_id:\n            raise _error(\n                "instagram_publish_account_mismatch",\n                ErrorCategory.AUTH,\n                "La segunda autenticación pertenece a otra cuenta de Instagram.",\n                operation="instagram_manual_publication.publish",\n            )\n        intent_payload = {\n            "schema_version": _SCHEMA_VERSION,\n            "prepared_artifact_id": record.artifact_id,\n            "manifest_artifact_id": record.prepared.manifest_artifact_id,\n            "publication_package_hash": record.prepared.publication_package_hash,\n            "ig_user_id": record.prepared.ig_user_id,\n            "container_id": record.prepared.container_id,\n            "status": "STARTED",\n            "contains_credentials": False,\n            "auto_publication": False,\n        }\n        try:\n            store.put_json(\n                project_id,\n                INSTAGRAM_PUBLISH_INTENT_ARTIFACT_TYPE,\n                intent_payload,\n                producer=_PRODUCER,\n                input_artifact_ids=(record.artifact_id,),\n                metadata={\n                    "container_id": record.prepared.container_id,\n                    "contains_credentials": False,\n                },\n            )\n        except Exception as exc:\n            raise _error(\n                "instagram_publish_intent_persistence_failed",\n                ErrorCategory.FILESYSTEM,\n                (\n                    "No se pudo registrar de forma durable el intento de publicación. "\n                    "media_publish no se ejecutará."\n                ),\n                operation="instagram_manual_publication.publish",\n                details={"container_id": record.prepared.container_id},\n                cause=exc,\n            ) from exc\n        result = publish(\n            store,\n            record.prepared,\n            access_token=access_token,\n            approved=True,\n        )\n'''
          if old not in text:
              raise SystemExit("publish call anchor missing")
          text = text.replace(old, new, 1)
          service.write_text(text, encoding="utf-8")

          ui = Path("webui/product/publication.py")
          text = ui.read_text(encoding="utf-8")
          old = '''from app.services.instagram_manual_publication import (\n    get_instagram_publish_receipt,\n    load_latest_prepared_instagram_reel,\n'''
          new = '''from app.services.instagram_manual_publication import (\n    get_instagram_publish_receipt,\n    get_unresolved_instagram_publish_intent,\n    load_latest_prepared_instagram_reel,\n'''
          if old not in text:
              raise SystemExit("UI import anchor missing")
          text = text.replace(old, new, 1)
          old = '''        prepared = load_latest_prepared_instagram_reel(service.store, project_id)\n        receipt = get_instagram_publish_receipt(service.store, project_id)\n'''
          new = '''        prepared = load_latest_prepared_instagram_reel(service.store, project_id)\n        receipt = get_instagram_publish_receipt(service.store, project_id)\n        unresolved_intent = get_unresolved_instagram_publish_intent(service.store, project_id)\n'''
          if old not in text:
              raise SystemExit("UI state-load anchor missing")
          text = text.replace(old, new, 1)
          old = '''    if prepared is None:\n        st.info(\n'''
          new = '''    if unresolved_intent is not None:\n        st.warning(\n            "Existe un intento previo de publicación cuyo resultado remoto no está resuelto. "\n            "Por seguridad no se ofrece otro media_publish."\n        )\n        with st.expander("Intento de Instagram por resolver", expanded=True):\n            st.code(unresolved_intent.container_id or "—", language=None)\n            st.caption(\n                "Verifica manualmente el estado de este Reel en Instagram antes de cualquier recuperación futura."\n            )\n        return\n\n    if prepared is None:\n        st.info(\n'''
          if old not in text:
              raise SystemExit("UI unresolved-state anchor missing")
          text = text.replace(old, new, 1)
          ui.write_text(text, encoding="utf-8")

          test = Path("test/services/test_instagram_manual_publication.py")
          text = test.read_text(encoding="utf-8")
          old = '''    INSTAGRAM_PREPARED_REEL_ARTIFACT_TYPE,\n    INSTAGRAM_PUBLISH_RECEIPT_ARTIFACT_TYPE,\n    get_instagram_publish_receipt,\n'''
          new = '''    INSTAGRAM_PREPARED_REEL_ARTIFACT_TYPE,\n    INSTAGRAM_PUBLISH_INTENT_ARTIFACT_TYPE,\n    INSTAGRAM_PUBLISH_RECEIPT_ARTIFACT_TYPE,\n    get_instagram_publish_receipt,\n    get_unresolved_instagram_publish_intent,\n'''
          if old not in text:
              raise SystemExit("service test import anchor missing")
          text = text.replace(old, new, 1)
          old = '''    assert result.success is True\n    assert order == ["oauth", "publish"]\n    receipt = get_instagram_publish_receipt(store, PROJECT_ID)\n'''
          new = '''    assert result.success is True\n    assert order == ["oauth", "publish"]\n    intents = store.list_artifacts(PROJECT_ID, artifact_type=INSTAGRAM_PUBLISH_INTENT_ARTIFACT_TYPE)\n    assert len(intents) == 1\n    intent_payload = store.read_json(PROJECT_ID, intents[0].artifact_id, verify_integrity=True)\n    assert intent_payload["status"] == "STARTED"\n    assert intent_payload["contains_credentials"] is False\n    assert "runtime-secret-token" not in str(intent_payload)\n    receipt = get_instagram_publish_receipt(store, PROJECT_ID)\n'''
          if old not in text:
              raise SystemExit("success test anchor missing")
          text = text.replace(old, new, 1)
          old = '''    assert exc_info.value.code == "instagram_publish_receipt_persistence_failed"\n    assert exc_info.value.retryable is False\n    assert "No reintentes automáticamente" in exc_info.value.safe_message\n'''
          new = '''    assert exc_info.value.code == "instagram_publish_receipt_persistence_failed"\n    assert exc_info.value.retryable is False\n    assert "No reintentes automáticamente" in exc_info.value.safe_message\n    unresolved = get_unresolved_instagram_publish_intent(store, PROJECT_ID)\n    assert unresolved is not None\n    second_calls = []\n    with pytest.raises(CentinelaError) as second_exc:\n        publish_instagram_manual_publication(\n            store,\n            PROJECT_ID,\n            approved=True,\n            oauth_authorize=lambda: second_calls.append("oauth"),\n            publish=lambda *args, **kwargs: second_calls.append("publish"),\n        )\n    assert second_exc.value.code == "instagram_publish_outcome_unresolved"\n    assert second_calls == []\n'''
          if old not in text:
              raise SystemExit("uncertainty test anchor missing")
          text = text.replace(old, new, 1)
          text += '''\n\ndef test_publish_intent_persistence_failure_prevents_remote_call(tmp_path, monkeypatch):\n    store = _store(tmp_path)\n    prepared = _prepared()\n    persist_prepared_instagram_reel(store, prepared)\n    monkeypatch.setattr(\n        "app.services.instagram_manual_publication.verify_publication_package",\n        lambda *args, **kwargs: _package(prepared),\n    )\n    original_put_json = store.put_json\n    calls = []\n\n    def failing_put_json(project_id, artifact_type, payload, **kwargs):\n        if artifact_type == INSTAGRAM_PUBLISH_INTENT_ARTIFACT_TYPE:\n            raise OSError("intent disk failure")\n        return original_put_json(project_id, artifact_type, payload, **kwargs)\n\n    monkeypatch.setattr(store, "put_json", failing_put_json)\n    with pytest.raises(CentinelaError) as exc_info:\n        publish_instagram_manual_publication(\n            store,\n            PROJECT_ID,\n            approved=True,\n            oauth_authorize=lambda: _oauth(),\n            publish=lambda *args, **kwargs: calls.append("publish"),\n        )\n    assert exc_info.value.code == "instagram_publish_intent_persistence_failed"\n    assert calls == []\n'''
          test.write_text(text, encoding="utf-8")

          ui_test = Path("test/services/test_product_instagram_manual_publication_ui.py")
          text = ui_test.read_text(encoding="utf-8")
          old = '''    assert "get_instagram_publish_receipt" in source\n    assert "callback_runtime_status" in source\n'''
          new = '''    assert "get_instagram_publish_receipt" in source\n    assert "get_unresolved_instagram_publish_intent" in source\n    assert "resultado remoto no está resuelto" in source\n    assert "callback_runtime_status" in source\n'''
          if old not in text:
              raise SystemExit("UI test anchor missing")
          ui_test.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Validate C13 hardening
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --python 3.11
          uv run --python 3.11 pytest -q \
            test/services/test_instagram_manual_publication.py \
            test/services/test_product_instagram_manual_publication_ui.py \
            test/services/test_product_manual_publication_ui.py \
            test/services/test_instagram_ephemeral_https.py \
            test/services/test_instagram_oauth.py \
            test/services/test_instagram_oauth_callback.py
          uv run --python 3.11 ruff check \
            app/services/instagram_manual_publication.py \
            webui/product/publication.py \
            test/services/test_instagram_manual_publication.py \
            test/services/test_product_instagram_manual_publication_ui.py
          uv run --python 3.11 python -m py_compile \
            app/services/instagram_manual_publication.py \
            webui/product/publication.py
      - name: Commit only C13 functional hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/instagram_manual_publication.py \
            webui/product/publication.py \
            test/services/test_instagram_manual_publication.py \
            test/services/test_product_instagram_manual_publication_ui.py
          git diff --cached --quiet && exit 0
          git commit -m "instagram: fail closed on unresolved publish outcome"
          git push
