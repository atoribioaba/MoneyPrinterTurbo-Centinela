name: Centinela C16 FactLock Fixture Sweep

on:
  push:
    branches:
      - centinela-engineering/c05-c16-factlock-adversarial-currentline-v0.1

permissions:
  contents: write

jobs:
  reconcile-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out C16
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Reconcile remaining FactLock fixtures
        shell: python
        run: |
          from pathlib import Path

          def add_writer_helper(src: str) -> str:
              if "compute_fact_lock_context_hash" in src:
                  return src
              if "from app.services.centinela.writer_room.models import FactLock" in src:
                  return src.replace(
                      "from app.services.centinela.writer_room.models import FactLock",
                      "from app.services.centinela.writer_room.models import (\n"
                      "    FactLock,\n"
                      "    compute_fact_lock_context_hash,\n"
                      ")",
                      1,
                  )
              if "    FactLock,\n" in src:
                  return src.replace(
                      "    FactLock,\n",
                      "    FactLock,\n    compute_fact_lock_context_hash,\n",
                      1,
                  )
              if "from app.services.centinela.writer_room import FactLock" in src:
                  return src.replace(
                      "from app.services.centinela.writer_room import FactLock",
                      "from app.services.centinela.writer_room import (\n"
                      "    FactLock,\n"
                      "    compute_fact_lock_context_hash,\n"
                      ")",
                      1,
                  )
              raise SystemExit("FactLock helper import anchor missing")

          def source_reference_expr(source_id: str) -> str:
              return f'''SourceReference(\n                source_id="{source_id}",\n                title="FactLock fixture source",\n                provider="TEST",\n                url="https://example.invalid/factlock",\n                license="TEST",\n                classification="PRIMARY_TEST_SOURCE",\n                role="scientific_fixture",\n                scientific_status=ScientificStatus.HECHO_VERIFICADO,\n            )'''

          # AV runtime fixture: sourceful FactLock and matching FinalScript hash.
          path = Path("test/services/test_av_runtime.py")
          src = add_writer_helper(path.read_text(encoding="utf-8"))
          src = src.replace(
              "from app.models.astronomy import ScientificStatus\n",
              "from app.models.astronomy import ScientificStatus, SourceReference\n",
              1,
          )
          old = '''def _fact_lock() -> FactLock:\n    return FactLock(\n        subject="La Luna",\n        research_mode="GENERIC_GEOCENTRIC",\n        context_hash="A" * 64,\n        facts=[\n            GroundingFact(\n                fact_id="body:moon:geocentric_distance_km",\n                label_es="Distancia geocéntrica lunar",\n                value=384400.0,\n                unit="km",\n                scientific_status=ScientificStatus.HECHO_VERIFICADO,\n                source_ids=["astronomy-engine"],\n            )\n        ],\n        sources=[],\n        source_ids=["astronomy-engine"],\n'''
          fact_block = '''    facts = [\n        GroundingFact(\n            fact_id="body:moon:geocentric_distance_km",\n            label_es="Distancia geocéntrica lunar",\n            value=384400.0,\n            unit="km",\n            scientific_status=ScientificStatus.HECHO_VERIFICADO,\n            source_ids=["astronomy-engine"],\n        )\n    ]\n    return FactLock(\n        subject="La Luna",\n        research_mode="GENERIC_GEOCENTRIC",\n        context_hash=compute_fact_lock_context_hash(\n            facts, ["astronomy-engine"]\n        ),\n        facts=facts,\n        sources=[\n            ''' + source_reference_expr("astronomy-engine") + '''\n        ],\n        source_ids=["astronomy-engine"],\n'''
          if old not in src:
              raise SystemExit("AV runtime FactLock anchor missing")
          src = src.replace(old, "def _fact_lock() -> FactLock:\n" + fact_block, 1)
          src = src.replace(
              '        fact_lock_hash="A" * 64,',
              "        fact_lock_hash=_fact_lock().context_hash,",
              1,
          )
          src = src.replace(
              '    assert plan.context_hash == "A" * 64',
              "    assert plan.context_hash == _fact_lock().context_hash",
              1,
          )
          path.write_text(src, encoding="utf-8")

          # C3 research-adapter base fixture: no sources, canonical empty-source hash.
          path = Path("test/services/test_c3_astronomy_research_adapters.py")
          src = add_writer_helper(path.read_text(encoding="utf-8"))
          old = '''def _base_fact_lock_adapter() -> Mock:\n    fact_lock = FactLock(\n        subject="Synthetic target",\n        research_mode="GENERIC_GEOCENTRIC",\n        context_hash="A" * 64,\n        facts=[\n            GroundingFact(\n                fact_id="base-fact",\n                label_es="Hecho base sintético",\n                value=1,\n                unit=None,\n                scientific_status=ScientificStatus.NO_VERIFICADO,\n                source_ids=[],\n            )\n        ],\n        sources=[],\n        source_ids=[],\n'''
          new = '''def _base_fact_lock_adapter() -> Mock:\n    facts = [\n        GroundingFact(\n            fact_id="base-fact",\n            label_es="Hecho base sintético",\n            value=1,\n            unit=None,\n            scientific_status=ScientificStatus.NO_VERIFICADO,\n            source_ids=[],\n        )\n    ]\n    fact_lock = FactLock(\n        subject="Synthetic target",\n        research_mode="GENERIC_GEOCENTRIC",\n        context_hash=compute_fact_lock_context_hash(facts, []),\n        facts=facts,\n        sources=[],\n        source_ids=[],\n'''
          if old not in src:
              raise SystemExit("C3 adapter FactLock anchor missing")
          path.write_text(src.replace(old, new, 1), encoding="utf-8")

          # Scientific conflict fixture: no sources, canonical empty-source hash.
          path = Path("test/services/test_scientific_conflict_resolver.py")
          src = add_writer_helper(path.read_text(encoding="utf-8"))
          old = '''def _base_adapter() -> Mock:\n    base_fact_lock = FactLock(\n        subject="Synthetic target",\n        research_mode="GENERIC_GEOCENTRIC",\n        context_hash="A" * 64,\n        facts=[\n            GroundingFact(\n                fact_id="base-fact",\n                label_es="Hecho base sintético",\n                value=1,\n                unit=None,\n                scientific_status=ScientificStatus.NO_VERIFICADO,\n                source_ids=[],\n            )\n        ],\n        sources=[],\n        source_ids=[],\n'''
          new = '''def _base_adapter() -> Mock:\n    facts = [\n        GroundingFact(\n            fact_id="base-fact",\n            label_es="Hecho base sintético",\n            value=1,\n            unit=None,\n            scientific_status=ScientificStatus.NO_VERIFICADO,\n            source_ids=[],\n        )\n    ]\n    base_fact_lock = FactLock(\n        subject="Synthetic target",\n        research_mode="GENERIC_GEOCENTRIC",\n        context_hash=compute_fact_lock_context_hash(facts, []),\n        facts=facts,\n        sources=[],\n        source_ids=[],\n'''
          if old not in src:
              raise SystemExit("conflict resolver FactLock anchor missing")
          path.write_text(src.replace(old, new, 1), encoding="utf-8")

          # Lunar replay fixture: sourceful FactLock. The separate AstronomyVideoPlan
          # context_hash remains a deterministic plan fixture and is not FactLock.
          path = Path("test/services/test_lunar_media_cloud_replay.py")
          src = add_writer_helper(path.read_text(encoding="utf-8"))
          src = src.replace(
              "from app.models.astronomy import ScientificStatus\n",
              "from app.models.astronomy import ScientificStatus, SourceReference\n",
              1,
          )
          func_start = src.index("def _fact_lock() -> FactLock:")
          return_idx = src.index("    return FactLock(\n", func_start)
          facts_start = src.index("        facts=[\n", return_idx)
          facts_end = src.index("        ],\n        sources=", facts_start)
          facts_block = src[
              facts_start + len("        facts=") : facts_end + len("        ]")
          ]
          prefix = src[:return_idx]
          suffix = src[return_idx:]
          suffix = suffix.replace(
              "        facts=" + facts_block,
              "        facts=facts",
              1,
          )
          suffix = suffix.replace(
              '        context_hash="C" * 64,',
              '        context_hash=compute_fact_lock_context_hash(\n'
              '            facts, ["source:fixture"]\n'
              '        ),',
              1,
          )
          suffix = suffix.replace(
              "        sources=[],",
              "        sources=[\n            "
              + source_reference_expr("source:fixture")
              + "\n        ],",
              1,
          )
          path.write_text(
              prefix + "    facts = " + facts_block + "\n" + suffix,
              encoding="utf-8",
          )

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Targeted reconciled fixtures
        run: >-
          uv run --no-sync pytest -q
          test/services/test_av_runtime.py
          test/services/test_c3_astronomy_research_adapters.py
          test/services/test_lunar_media_cloud_replay.py
          test/services/test_scientific_conflict_resolver.py
          test/services/test_factlock_semantic_integrity_c16.py
          test/services/test_factlock_writer_room_adversarial.py
          test/services/test_writer_room_adversarial_regression.py
          test/services/test_factlock_scientific_visuals.py
          test/services/test_writer_room.py
          test/services/test_scene_grounding_cloud.py

      - name: Fail on remaining direct synthetic FactLock hashes
        shell: python
        run: |
          import ast
          from pathlib import Path

          findings = []
          for path in Path("test").rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  func = node.func
                  name = func.id if isinstance(func, ast.Name) else getattr(func, "attr", "")
                  if name != "FactLock":
                      continue
                  for kw in node.keywords:
                      if kw.arg != "context_hash":
                          continue
                      value = kw.value
                      if (
                          isinstance(value, ast.BinOp)
                          and isinstance(value.op, ast.Mult)
                          and isinstance(value.left, ast.Constant)
                          and isinstance(value.left.value, str)
                          and isinstance(value.right, ast.Constant)
                          and value.right.value == 64
                      ):
                          findings.append(f"{path}:{node.lineno}")
          if findings:
              raise SystemExit("stale synthetic FactLock hashes: " + ", ".join(findings))
          print("DIRECT_SYNTHETIC_FACTLOCK_HASHES=0")

      - name: Ruff and compile
        run: |
          uv run --no-sync ruff check \
            app/services/centinela/writer_room \
            test/services/test_factlock_semantic_integrity_c16.py \
            test/services/test_factlock_writer_room_adversarial.py \
            test/services/test_writer_room_adversarial_regression.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_writer_room.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_av_runtime.py \
            test/services/test_c3_astronomy_research_adapters.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_scientific_conflict_resolver.py
          uv run --no-sync python -m compileall \
            app/services/centinela/writer_room \
            test/services/test_factlock_semantic_integrity_c16.py

      - name: Commit fixture reconciliation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            test/services/test_av_runtime.py \
            test/services/test_c3_astronomy_research_adapters.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_scientific_conflict_resolver.py
          git diff --cached --quiet && exit 0
          unexpected="$(git diff --cached --name-only | grep -Ev '^test/services/test_(av_runtime|c3_astronomy_research_adapters|lunar_media_cloud_replay|scientific_conflict_resolver)\.py$' || true)"
          test -z "$unexpected"
          git commit -m "test: reconcile FactLock fixtures with semantic hash contract"
          git push
