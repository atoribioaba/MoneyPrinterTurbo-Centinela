name: Centinela C16 FactLock Semantic Hardening

on:
  push:
    branches:
      - centinela-engineering/c05-c16-factlock-semantic-integrity-v0.1

permissions:
  contents: write

jobs:
  harden-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out C16
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Apply C16 FactLock semantic hardening
        shell: python
        run: |
          from pathlib import Path

          models = Path("app/services/centinela/writer_room/models.py")
          text = models.read_text(encoding="utf-8")
          old = "from __future__ import annotations\n\nfrom datetime import datetime\n"
          new = "from __future__ import annotations\n\nimport hashlib\nimport json\nimport re\nfrom datetime import datetime\n"
          if old not in text:
              raise SystemExit("models import anchor missing")
          text = text.replace(old, new, 1)

          old = '''WRITER_ROOM_LOGICAL_STAGES = (\n    "FACT_LOCK",\n    "CREATIVE_THESIS",\n    "STORY_ARCHITECT",\n    "HOOK_ROOM",\n    "DRAFT",\n    "SCIENCE_CRITIC",\n    "RETENTION_CRITIC",\n    "VISUAL_CRITIC",\n    "REWRITE",\n    "ADVERSARIAL_READER",\n    "FINAL_POLISH",\n    "SOCIAL_COMPRESSION",\n)\n\n\nclass StrictWriterModel(BaseModel):\n'''
          new = '''WRITER_ROOM_LOGICAL_STAGES = (\n    "FACT_LOCK",\n    "CREATIVE_THESIS",\n    "STORY_ARCHITECT",\n    "HOOK_ROOM",\n    "DRAFT",\n    "SCIENCE_CRITIC",\n    "RETENTION_CRITIC",\n    "VISUAL_CRITIC",\n    "REWRITE",\n    "ADVERSARIAL_READER",\n    "FINAL_POLISH",\n    "SOCIAL_COMPRESSION",\n)\n\n_CONTEXT_HASH_RE = re.compile(r"^[0-9A-F]{64}$")\n\n\nclass StrictWriterModel(BaseModel):\n'''
          if old not in text:
              raise SystemExit("models stages anchor missing")
          text = text.replace(old, new, 1)

          old = '''class StrictWriterModel(BaseModel):\n    model_config = ConfigDict(extra="forbid", validate_assignment=True)\n\n\nclass WriterRoomRequest(StrictWriterModel):\n'''
          new = '''class StrictWriterModel(BaseModel):\n    model_config = ConfigDict(extra="forbid", validate_assignment=True)\n\n\ndef compute_fact_lock_context_hash(\n    facts: list[GroundingFact],\n    source_ids: list[str],\n) -> str:\n    """Return the canonical semantic hash used by every FactLock producer."""\n    payload = {\n        "facts": [item.model_dump(mode="json") for item in facts],\n        "source_ids": list(source_ids),\n    }\n    raw = json.dumps(\n        payload,\n        ensure_ascii=False,\n        sort_keys=True,\n        separators=(",", ":"),\n    ).encode("utf-8")\n    return hashlib.sha256(raw).hexdigest().upper()\n\n\nclass WriterRoomRequest(StrictWriterModel):\n'''
          if old not in text:
              raise SystemExit("models compute anchor missing")
          text = text.replace(old, new, 1)

          old = '''    @field_validator("source_ids")\n    @classmethod\n    def unique_source_ids(cls, value: list[str]) -> list[str]:\n        result: list[str] = []\n        seen: set[str] = set()\n        for item in value:\n            item = item.strip()\n            if item and item not in seen:\n                seen.add(item)\n                result.append(item)\n        return result\n\n\nclass ScriptClaim(StrictWriterModel):\n'''
          new = '''    @field_validator("source_ids")\n    @classmethod\n    def unique_source_ids(cls, value: list[str]) -> list[str]:\n        return sorted({item.strip() for item in value if item.strip()})\n\n    @model_validator(mode="after")\n    def validate_semantic_integrity(self):\n        fact_ids = [fact.fact_id.strip() for fact in self.facts]\n        if len(fact_ids) != len(set(fact_ids)):\n            raise ValueError("FactLock fact_id values must be unique")\n\n        canonical_source_ids = sorted(\n            {\n                source_id.strip()\n                for fact in self.facts\n                for source_id in fact.source_ids\n                if source_id.strip()\n            }\n        )\n        if self.source_ids != canonical_source_ids:\n            raise ValueError(\n                "FactLock source_ids must equal the canonical union of fact source_ids"\n            )\n\n        source_reference_ids = [source.source_id.strip() for source in self.sources]\n        if len(source_reference_ids) != len(set(source_reference_ids)):\n            raise ValueError("FactLock SourceReference source_id values must be unique")\n        missing_sources = sorted(set(self.source_ids) - set(source_reference_ids))\n        if missing_sources:\n            raise ValueError(\n                "FactLock source_ids missing SourceReference entries: "\n                + ", ".join(missing_sources)\n            )\n\n        if not _CONTEXT_HASH_RE.fullmatch(self.context_hash):\n            raise ValueError("FactLock context_hash must be uppercase SHA-256 hex")\n        expected_hash = compute_fact_lock_context_hash(self.facts, self.source_ids)\n        if self.context_hash != expected_hash:\n            raise ValueError("FactLock context_hash does not match facts/source_ids")\n        return self\n\n\nclass ScriptClaim(StrictWriterModel):\n'''
          if old not in text:
              raise SystemExit("models validator anchor missing")
          text = text.replace(old, new, 1)
          models.write_text(text, encoding="utf-8")

          init = Path("app/services/centinela/writer_room/__init__.py")
          text = init.read_text(encoding="utf-8")
          old = '''    WriterRoomReport,\n    WriterRoomRequest,\n)\n'''
          new = '''    WriterRoomReport,\n    WriterRoomRequest,\n    compute_fact_lock_context_hash,\n)\n'''
          if old not in text:
              raise SystemExit("writer_room init import anchor missing")
          text = text.replace(old, new, 1)
          old = '''    "WriterRoomStageAdapter",\n    "build_fact_lock_stage_binding",\n'''
          new = '''    "WriterRoomStageAdapter",\n    "compute_fact_lock_context_hash",\n    "build_fact_lock_stage_binding",\n'''
          if old not in text:
              raise SystemExit("writer_room init all anchor missing")
          text = text.replace(old, new, 1)
          init.write_text(text, encoding="utf-8")

          spine = Path("app/services/centinela/writer_room/spine_adapter.py")
          text = spine.read_text(encoding="utf-8")
          old = "import hashlib\nimport json\nimport unicodedata\n"
          new = "import unicodedata\n"
          if old not in text:
              raise SystemExit("spine import anchor missing")
          text = text.replace(old, new, 1)
          old = '''    FactLock,\n    WriterRoomRequest,\n)\n'''
          new = '''    FactLock,\n    WriterRoomRequest,\n    compute_fact_lock_context_hash,\n)\n'''
          if old not in text:
              raise SystemExit("spine model import anchor missing")
          text = text.replace(old, new, 1)
          start = text.find("def _hash_facts(")
          end = text.find("def _subject_is_time_sensitive", start)
          if start < 0 or end < 0:
              raise SystemExit("spine duplicate hash function anchor missing")
          text = text[:start] + text[end:]
          old = "context_hash=_hash_facts(facts, source_ids),"
          new = "context_hash=compute_fact_lock_context_hash(facts, source_ids),"
          if old not in text:
              raise SystemExit("spine generic hash call anchor missing")
          text = text.replace(old, new, 1)
          spine.write_text(text, encoding="utf-8")

          room = Path("app/services/centinela/writer_room/room.py")
          text = room.read_text(encoding="utf-8")
          old = "from typing import Any, Callable\n\nfrom app.models.astronomy import ScientificStatus\n"
          new = "from typing import Any, Callable\n\nfrom pydantic import ValidationError\n\nfrom app.models.astronomy import ScientificStatus\n"
          if old not in text:
              raise SystemExit("room import anchor missing")
          text = text.replace(old, new, 1)
          old = '''    ) -> tuple[FinalScript, WriterRoomReport]:\n        if request.subject.strip().casefold() != fact_lock.subject.strip().casefold():\n'''
          new = '''    ) -> tuple[FinalScript, WriterRoomReport]:\n        try:\n            fact_lock = FactLock.model_validate(fact_lock.model_dump(mode="json"))\n        except (AttributeError, TypeError, ValueError, ValidationError) as exc:\n            raise WriterRoomError(\n                "FactLock semantic integrity validation failed"\n            ) from exc\n\n        if request.subject.strip().casefold() != fact_lock.subject.strip().casefold():\n'''
          if old not in text:
              raise SystemExit("room generate anchor missing")
          text = text.replace(old, new, 1)
          room.write_text(text, encoding="utf-8")

          test_writer = Path("test/services/test_writer_room.py")
          text = test_writer.read_text(encoding="utf-8")
          old = '''    WriterRoom,\n    WriterRoomRequest,\n    build_writer_room_stage_binding,\n)\n'''
          new = '''    WriterRoom,\n    WriterRoomError,\n    WriterRoomRequest,\n    build_writer_room_stage_binding,\n    compute_fact_lock_context_hash,\n)\n'''
          if old not in text:
              raise SystemExit("test_writer imports anchor missing")
          text = text.replace(old, new, 1)
          start = text.find('def fact_lock(subject="Saturno"):\n')
          end = text.find('\n\ndef claim():', start)
          if start < 0 or end < 0:
              raise SystemExit("test_writer fact_lock fixture anchor missing")
          replacement = '''def fact_lock(subject="Saturno"):\n    facts = [\n        fact("context:moment_utc", "2026-08-23T20:00:00+00:00"),\n        fact("observer:latitude_deg", 0.0, unit="deg"),\n        fact("observer:longitude_deg", 0.0, unit="deg"),\n        fact("body:saturn:altitude_apparent_deg", 25.0, unit="deg"),\n        fact("body:saturn:azimuth_deg", 120.0, unit="deg"),\n    ]\n    return FactLock(\n        subject=subject,\n        research_mode="OBSERVATION_CONTEXT",\n        context_hash=compute_fact_lock_context_hash(facts, []),\n        facts=facts,\n        sources=[],\n        source_ids=[],\n        scope_note="test",\n        location_assumed=False,\n        moment_basis="explicit_project_moment",\n        generated_at_utc=datetime.now(timezone.utc),\n    )\n'''
          text = text[:start] + replacement + text[end:]
          marker = '''def test_writer_room_rejects_unknown_fact_id():\n'''
          if marker not in text:
              raise SystemExit("test_writer insertion anchor missing")
          adversarial = '''def test_writer_room_revalidates_model_copy_fact_lock_before_runtime():\n    original = fact_lock()\n    tampered = original.model_copy(update={"context_hash": "B" * 64})\n\n    with pytest.raises(WriterRoomError, match="semantic integrity"):\n        WriterRoom(runtime=FakeRuntime()).generate(\n            WriterRoomRequest(subject="Saturno"),\n            tampered,\n        )\n\n\n'''
          text = text.replace(marker, adversarial + marker, 1)
          test_writer.write_text(text, encoding="utf-8")

          new_test = Path("test/services/test_factlock_semantic_integrity.py")
          new_test.write_text('''from __future__ import annotations\n\nfrom datetime import datetime, timezone\n\nimport pytest\nfrom pydantic import ValidationError\n\nfrom app.models.astronomy import ScientificStatus, SourceReference\nfrom app.models.astronomy_director import GroundingFact\nfrom app.services.centinela.writer_room import (\n    FactLock,\n    compute_fact_lock_context_hash,\n)\n\n\ndef _fact(fact_id: str, value: object, source_ids: list[str]) -> GroundingFact:\n    return GroundingFact(\n        fact_id=fact_id,\n        label_es=fact_id,\n        value=value,\n        unit=None,\n        scientific_status=ScientificStatus.HECHO_VERIFICADO,\n        source_ids=source_ids,\n    )\n\n\ndef _source(source_id: str) -> SourceReference:\n    return SourceReference(\n        source_id=source_id,\n        title=f"Source {source_id}",\n        provider="TEST_PRIMARY",\n        url="https://example.invalid/source",\n        license=None,\n        classification="DOCUMENTACION_OFICIAL",\n        role="primary scientific evidence",\n        scientific_status=ScientificStatus.HECHO_VERIFICADO,\n    )\n\n\ndef _payload() -> dict[str, object]:\n    facts = [\n        _fact("fact:a", 1, ["src:b", "src:a"]),\n        _fact("fact:b", 2, ["src:a"]),\n    ]\n    source_ids = ["src:a", "src:b"]\n    return {\n        "subject": "Saturno",\n        "research_mode": "OBSERVATION_CONTEXT",\n        "context_hash": compute_fact_lock_context_hash(facts, source_ids),\n        "facts": facts,\n        "sources": [_source("src:a"), _source("src:b")],\n        "source_ids": source_ids,\n        "scope_note": "semantic integrity test",\n        "location_assumed": False,\n        "moment_basis": "explicit_project_moment",\n        "generated_at_utc": datetime.now(timezone.utc),\n    }\n\n\ndef test_fact_lock_accepts_canonical_semantic_payload() -> None:\n    value = FactLock.model_validate(_payload())\n    assert value.source_ids == ["src:a", "src:b"]\n    assert value.context_hash == compute_fact_lock_context_hash(\n        value.facts, value.source_ids\n    )\n\n\ndef test_fact_lock_canonicalizes_source_id_order_before_hash_check() -> None:\n    payload = _payload()\n    payload["source_ids"] = ["src:b", "src:a", "src:a"]\n    value = FactLock.model_validate(payload)\n    assert value.source_ids == ["src:a", "src:b"]\n\n\ndef test_fact_lock_rejects_duplicate_fact_ids() -> None:\n    payload = _payload()\n    facts = list(payload["facts"])\n    facts[1] = facts[1].model_copy(update={"fact_id": "fact:a"})\n    payload["facts"] = facts\n    payload["context_hash"] = compute_fact_lock_context_hash(\n        facts, ["src:a", "src:b"]\n    )\n    with pytest.raises(ValidationError, match="fact_id values must be unique"):\n        FactLock.model_validate(payload)\n\n\ndef test_fact_lock_rejects_source_union_mismatch() -> None:\n    payload = _payload()\n    payload["source_ids"] = ["src:a"]\n    payload["context_hash"] = compute_fact_lock_context_hash(\n        list(payload["facts"]), ["src:a"]\n    )\n    with pytest.raises(ValidationError, match="canonical union"):\n        FactLock.model_validate(payload)\n\n\ndef test_fact_lock_rejects_missing_source_reference() -> None:\n    payload = _payload()\n    payload["sources"] = [_source("src:a")]\n    with pytest.raises(ValidationError, match="missing SourceReference"):\n        FactLock.model_validate(payload)\n\n\ndef test_fact_lock_rejects_duplicate_source_references() -> None:\n    payload = _payload()\n    payload["sources"] = [_source("src:a"), _source("src:a"), _source("src:b")]\n    with pytest.raises(ValidationError, match="SourceReference source_id values must be unique"):\n        FactLock.model_validate(payload)\n\n\n@pytest.mark.parametrize("context_hash", ["a" * 64, "A" * 63, "Z" * 64])\ndef test_fact_lock_rejects_noncanonical_hash_shape(context_hash: str) -> None:\n    payload = _payload()\n    payload["context_hash"] = context_hash\n    with pytest.raises(ValidationError, match="uppercase SHA-256"):\n        FactLock.model_validate(payload)\n\n\ndef test_fact_lock_rejects_fact_mutation_with_stale_hash() -> None:\n    payload = _payload()\n    facts = list(payload["facts"])\n    facts[0] = facts[0].model_copy(update={"value": 999})\n    payload["facts"] = facts\n    with pytest.raises(ValidationError, match="does not match facts/source_ids"):\n        FactLock.model_validate(payload)\n''', encoding="utf-8")
      - name: Install locked dev environment
        run: uv sync --frozen --group dev --python 3.11
      - name: Run focused C16 regressions
        run: |
          uv run --python 3.11 pytest -q \
            test/services/test_factlock_semantic_integrity.py \
            test/services/test_writer_room.py
      - name: Ruff changed Python files
        run: |
          uv run --python 3.11 ruff check \
            app/services/centinela/writer_room/models.py \
            app/services/centinela/writer_room/__init__.py \
            app/services/centinela/writer_room/spine_adapter.py \
            app/services/centinela/writer_room/room.py \
            test/services/test_writer_room.py \
            test/services/test_factlock_semantic_integrity.py
      - name: Compile changed Python files
        run: |
          uv run --python 3.11 python -m py_compile \
            app/services/centinela/writer_room/models.py \
            app/services/centinela/writer_room/__init__.py \
            app/services/centinela/writer_room/spine_adapter.py \
            app/services/centinela/writer_room/room.py \
            test/services/test_writer_room.py \
            test/services/test_factlock_semantic_integrity.py
      - name: Commit only C16 functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/centinela/writer_room/models.py \
            app/services/centinela/writer_room/__init__.py \
            app/services/centinela/writer_room/spine_adapter.py \
            app/services/centinela/writer_room/room.py \
            test/services/test_writer_room.py \
            test/services/test_factlock_semantic_integrity.py
          git diff --cached --quiet && exit 0
          mapfile -t files < <(git diff --cached --name-only)
          test "${#files[@]}" -eq 6
          git commit -m "hardening: make FactLock semantically self-verifying"
          git push
