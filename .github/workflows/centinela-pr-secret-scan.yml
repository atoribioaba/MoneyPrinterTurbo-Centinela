name: Centinela PR Secret Scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: centinela-pr-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-tree-secret-scan:
    name: Current-tree secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p .centinela-tools/gitleaks
          tar -xzf "$archive" -C .centinela-tools/gitleaks gitleaks
          .centinela-tools/gitleaks/gitleaks version | grep -F "$GITLEAKS_VERSION"

      - name: Scan current PR tree with full redaction
        shell: bash
        run: |
          set -uo pipefail
          GITLEAKS=".centinela-tools/gitleaks/gitleaks"

          set +e
          "$GITLEAKS" dir \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path gitleaks-current.json \
            . >gitleaks-current.log 2>&1
          CURRENT_RC=$?
          set -e

          CURRENT_RC="$CURRENT_RC" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("gitleaks-current.json")
          rows = []
          if report_path.exists() and report_path.read_text(encoding="utf-8").strip():
              data = json.loads(report_path.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  raise SystemExit("Unexpected Gitleaks report shape")
              rows = data

          safe_locations = []
          seen = set()
          for row in rows:
              item = {
                  "rule_id": str(row.get("RuleID", "UNKNOWN")),
                  "file": str(row.get("File", "UNKNOWN")),
              }
              key = (item["rule_id"], item["file"])
              if key not in seen:
                  seen.add(key)
                  safe_locations.append(item)

          print(f"GITLEAKS_CURRENT_TREE_FINDINGS={len(rows)}")
          print("SECRET_VALUES_EXPOSED_BY_AUDIT=FALSE")
          if safe_locations:
              print("GITLEAKS_REDACTED_LOCATIONS=" + json.dumps(safe_locations, sort_keys=True))

          rc = int(os.environ["CURRENT_RC"])
          if rc > 1:
              raise SystemExit(2)
          if rc == 1:
              raise SystemExit(1)
          PY
          SCAN_RC=$?

          rm -f gitleaks-current.json gitleaks-current.log

          if [ "$SCAN_RC" -eq 2 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=ERROR"
            exit 2
          fi
          if [ "$SCAN_RC" -eq 1 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=FINDINGS"
            exit 1
          fi

          echo "CENTINELA_PR_SECRET_SCAN=PASS"
