name: Centinela PR Secret Regression Scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: centinela-pr-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-regression-scan:
    name: Secret regression scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: head-tree

      - name: Check out PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: base-tree

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/centinela-gitleaks"
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version | grep -F "$GITLEAKS_VERSION"

      - name: Validate Gitleaks detector canary
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS="$RUNNER_TEMP/centinela-gitleaks/gitleaks"
          CANARY_DIR="$RUNNER_TEMP/centinela-gitleaks-canary"
          CANARY_REPORT="$RUNNER_TEMP/gitleaks-canary.json"
          CANARY_LOG="$RUNNER_TEMP/gitleaks-canary.log"
          mkdir -p "$CANARY_DIR"
          # Build a deliberately fake PAT-shaped canary at runtime so the repository
          # itself never contains the contiguous token. The value has no privileges.
          printf '%s%s\n' 'token = "ghp_wA9mK2pLxN4vRtQzY6bC8dEfGhJl' 'M0oPq1rS"' > "$CANARY_DIR/canary.txt"
          set +e
          "$GITLEAKS" dir \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$CANARY_REPORT" \
            "$CANARY_DIR" >"$CANARY_LOG" 2>&1
          CANARY_RC=$?
          set -e
          rm -rf "$CANARY_DIR" "$CANARY_REPORT" "$CANARY_LOG"
          if [ "$CANARY_RC" -ne 1 ]; then
            echo "GITLEAKS_CANARY=FAIL"
            exit 2
          fi
          echo "GITLEAKS_CANARY=PASS"

      - name: Compare base and head secret findings
        shell: bash
        run: |
          set -uo pipefail
          GITLEAKS="$RUNNER_TEMP/centinela-gitleaks/gitleaks"
          BASE_ROOT="$GITHUB_WORKSPACE/base-tree"
          HEAD_ROOT="$GITHUB_WORKSPACE/head-tree"
          BASE_REPORT="$RUNNER_TEMP/gitleaks-base.json"
          HEAD_REPORT="$RUNNER_TEMP/gitleaks-head.json"
          BASE_LOG="$RUNNER_TEMP/gitleaks-base.log"
          HEAD_LOG="$RUNNER_TEMP/gitleaks-head.log"

          set +e
          "$GITLEAKS" dir \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$BASE_REPORT" \
            "$BASE_ROOT" >"$BASE_LOG" 2>&1
          BASE_RC=$?

          "$GITLEAKS" dir \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$HEAD_REPORT" \
            "$HEAD_ROOT" >"$HEAD_LOG" 2>&1
          HEAD_RC=$?

          BASE_RC="$BASE_RC" HEAD_RC="$HEAD_RC" \
          BASE_REPORT="$BASE_REPORT" HEAD_REPORT="$HEAD_REPORT" \
          BASE_ROOT="$BASE_ROOT" HEAD_ROOT="$HEAD_ROOT" python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from collections import Counter
          from pathlib import Path

          def load_report(path: str) -> list[dict]:
              report = Path(path)
              if not report.exists() or not report.read_text(encoding="utf-8").strip():
                  return []
              data = json.loads(report.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  raise ValueError("unexpected Gitleaks report shape")
              return data

          def relative_path(raw_path: str, root: str) -> str:
              path = Path(raw_path)
              root_path = Path(root)
              try:
                  return path.resolve().relative_to(root_path.resolve()).as_posix()
              except Exception:
                  raw = str(raw_path).replace("\\", "/")
                  marker = root_path.name + "/"
                  return raw.split(marker, 1)[-1] if marker in raw else path.name

          def fingerprint_rows(rows: list[dict], root: str) -> Counter:
              counter = Counter()
              for row in rows:
                  rule_id = str(row.get("RuleID", "UNKNOWN"))
                  rel_path = relative_path(str(row.get("File", "UNKNOWN")), root)
                  secret = str(row.get("Secret", ""))
                  secret_digest = hashlib.sha256(secret.encode("utf-8")).digest()
                  counter[(rule_id, rel_path, secret_digest)] += 1
              return counter

          def safe_locations(rows: list[dict], root: str) -> list[str]:
              values = set()
              for row in rows:
                  rule_id = str(row.get("RuleID", "UNKNOWN"))
                  rel_path = relative_path(str(row.get("File", "UNKNOWN")), root)
                  start_line = str(row.get("StartLine", "0"))
                  payload = f"{rule_id}|{rel_path}|{start_line}".encode("utf-8")
                  values.add(base64.urlsafe_b64encode(payload).decode("ascii"))
              return sorted(values)

          try:
              base_rows = load_report(os.environ["BASE_REPORT"])
              head_rows = load_report(os.environ["HEAD_REPORT"])
          except Exception:
              print("CENTINELA_PR_SECRET_SCAN_SUMMARY=ERROR")
              raise SystemExit(2)

          base_rc = int(os.environ["BASE_RC"])
          head_rc = int(os.environ["HEAD_RC"])
          if base_rc > 1 or head_rc > 1:
              print("CENTINELA_PR_SECRET_SCAN_TOOL_ERROR=TRUE")
              raise SystemExit(2)

          base_counter = fingerprint_rows(base_rows, os.environ["BASE_ROOT"])
          head_counter = fingerprint_rows(head_rows, os.environ["HEAD_ROOT"])
          new_counter = head_counter - base_counter
          new_count = sum(new_counter.values())

          print(f"GITLEAKS_BASELINE_FINDINGS={len(base_rows)}")
          print(f"GITLEAKS_HEAD_FINDINGS={len(head_rows)}")
          print(f"GITLEAKS_NEW_FINDINGS={new_count}")
          print("GITLEAKS_BASELINE_LOCATIONS_B64=" + json.dumps(safe_locations(base_rows, os.environ["BASE_ROOT"])))
          print("SECRET_VALUES_EXPOSED_BY_AUDIT=FALSE")
          print("SECRET_FINGERPRINTS_EXPOSED_BY_AUDIT=FALSE")

          if new_count:
              rule_ids = sorted({key[0] for key in new_counter})
              encoded_paths = sorted({
                  base64.urlsafe_b64encode(key[1].encode("utf-8")).decode("ascii")
                  for key in new_counter
              })
              print("GITLEAKS_NEW_RULE_IDS=" + json.dumps(rule_ids))
              print("GITLEAKS_NEW_PATHS_B64=" + json.dumps(encoded_paths))
              raise SystemExit(1)
          PY
          SCAN_RC=$?
          set -e

          rm -f "$BASE_REPORT" "$HEAD_REPORT" "$BASE_LOG" "$HEAD_LOG"

          if [ "$SCAN_RC" -eq 2 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=ERROR"
            exit 2
          fi
          if [ "$SCAN_RC" -eq 1 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=NEW_FINDINGS"
            exit 1
          fi

          echo "CENTINELA_PR_SECRET_SCAN=PASS_NO_NEW_FINDINGS"
