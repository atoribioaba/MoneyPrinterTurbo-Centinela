name: Centinela PR Secret Scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: centinela-pr-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  current-tree-secret-scan:
    name: Current-tree secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/centinela-gitleaks"
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version | grep -F "$GITLEAKS_VERSION"

      - name: Scan current PR tree with full redaction
        shell: bash
        run: |
          set -uo pipefail
          GITLEAKS="$RUNNER_TEMP/centinela-gitleaks/gitleaks"
          REPORT="$RUNNER_TEMP/gitleaks-current.json"
          LOG="$RUNNER_TEMP/gitleaks-current.log"

          set +e
          "$GITLEAKS" dir \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$REPORT" \
            "$GITHUB_WORKSPACE" >"$LOG" 2>&1
          CURRENT_RC=$?

          CURRENT_RC="$CURRENT_RC" REPORT="$REPORT" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["REPORT"])
          rows = []
          try:
              if report_path.exists() and report_path.read_text(encoding="utf-8").strip():
                  data = json.loads(report_path.read_text(encoding="utf-8"))
                  if not isinstance(data, list):
                      raise ValueError("unexpected report shape")
                  rows = data
          except Exception:
              print("CENTINELA_PR_SECRET_SCAN_SUMMARY=ERROR")
              raise SystemExit(2)

          rule_ids = sorted({str(row.get("RuleID", "UNKNOWN")) for row in rows})
          encoded_paths = sorted({
              base64.urlsafe_b64encode(str(row.get("File", "UNKNOWN")).encode("utf-8")).decode("ascii")
              for row in rows
          })
          print(f"GITLEAKS_CURRENT_TREE_FINDINGS={len(rows)}")
          print("SECRET_VALUES_EXPOSED_BY_AUDIT=FALSE")
          if rule_ids:
              print("GITLEAKS_REDACTED_RULE_IDS=" + json.dumps(rule_ids))
          if encoded_paths:
              print("GITLEAKS_REDACTED_PATHS_B64=" + json.dumps(encoded_paths))

          rc = int(os.environ["CURRENT_RC"])
          if rc > 1:
              raise SystemExit(2)
          if rc == 1:
              raise SystemExit(1)
          PY
          SCAN_RC=$?
          set -e

          rm -f "$REPORT" "$LOG"

          if [ "$SCAN_RC" -eq 2 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=ERROR"
            exit 2
          fi
          if [ "$SCAN_RC" -eq 1 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=FINDINGS"
            exit 1
          fi

          echo "CENTINELA_PR_SECRET_SCAN=PASS"
