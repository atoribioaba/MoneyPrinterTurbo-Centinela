name: Centinela PR Secret Scan

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: centinela-pr-secret-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: head-tree

      - name: Check out PR base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: base-tree

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/centinela-gitleaks"
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$tool_dir"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" gitleaks
          "$tool_dir/gitleaks" version | grep -F "$GITLEAKS_VERSION"

      - name: Verify Gitleaks detection with synthetic canary
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS="$RUNNER_TEMP/centinela-gitleaks/gitleaks"
          CONFIG="$GITHUB_WORKSPACE/head-tree/.gitleaks.toml"
          CANARY_DIR="$RUNNER_TEMP/gitleaks-canary"
          CANARY_REPORT="$RUNNER_TEMP/gitleaks-canary.json"
          mkdir -p "$CANARY_DIR"

          # Construct at runtime so no credential-like literal is committed.
          printf 'api_key = "%s%s"\n' \
            'C3nt1nelaSynthetic' 'Canary_9F2x7Q4w8Z6m' \
            > "$CANARY_DIR/canary.txt"

          set +e
          "$GITLEAKS" dir \
            --config "$CONFIG" \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$CANARY_REPORT" \
            "$CANARY_DIR" >/dev/null 2>&1
          CANARY_RC=$?
          set -e

          CANARY_RC="$CANARY_RC" CANARY_REPORT="$CANARY_REPORT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          rc = int(os.environ["CANARY_RC"])
          report = Path(os.environ["CANARY_REPORT"])
          if rc != 1 or not report.exists():
              raise SystemExit("Gitleaks synthetic canary was not detected")
          rows = json.loads(report.read_text(encoding="utf-8"))
          if not any(row.get("RuleID") == "generic-api-key" for row in rows):
              raise SystemExit("Synthetic generic-api-key canary was not detected")
          print("GITLEAKS_CANARY_DETECTION=PASS")
          print("SYNTHETIC_SECRET_VALUE_EXPOSED=FALSE")
          PY

          rm -rf "$CANARY_DIR" "$CANARY_REPORT"

      - name: Scan base and require clean PR head
        shell: bash
        run: |
          set -uo pipefail
          GITLEAKS="$RUNNER_TEMP/centinela-gitleaks/gitleaks"
          CONFIG="$GITHUB_WORKSPACE/head-tree/.gitleaks.toml"
          BASE_ROOT="$GITHUB_WORKSPACE/base-tree"
          HEAD_ROOT="$GITHUB_WORKSPACE/head-tree"
          BASE_REPORT="$RUNNER_TEMP/gitleaks-base.json"
          HEAD_REPORT="$RUNNER_TEMP/gitleaks-head.json"
          BASE_LOG="$RUNNER_TEMP/gitleaks-base.log"
          HEAD_LOG="$RUNNER_TEMP/gitleaks-head.log"

          set +e
          "$GITLEAKS" dir \
            --config "$CONFIG" \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$BASE_REPORT" \
            "$BASE_ROOT" >"$BASE_LOG" 2>&1
          BASE_RC=$?

          "$GITLEAKS" dir \
            --config "$CONFIG" \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$HEAD_REPORT" \
            "$HEAD_ROOT" >"$HEAD_LOG" 2>&1
          HEAD_RC=$?

          BASE_RC="$BASE_RC" HEAD_RC="$HEAD_RC" \
          BASE_REPORT="$BASE_REPORT" HEAD_REPORT="$HEAD_REPORT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_report(path: str) -> list[dict]:
              report = Path(path)
              if not report.exists() or not report.read_text(encoding="utf-8").strip():
                  return []
              data = json.loads(report.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  raise ValueError("unexpected Gitleaks report shape")
              return data

          try:
              base_rows = load_report(os.environ["BASE_REPORT"])
              head_rows = load_report(os.environ["HEAD_REPORT"])
          except Exception:
              print("CENTINELA_PR_SECRET_SCAN_SUMMARY=ERROR")
              raise SystemExit(2)

          base_rc = int(os.environ["BASE_RC"])
          head_rc = int(os.environ["HEAD_RC"])
          if base_rc > 1 or head_rc > 1:
              print("CENTINELA_PR_SECRET_SCAN_TOOL_ERROR=TRUE")
              raise SystemExit(2)

          print(f"GITLEAKS_BASELINE_FINDINGS={len(base_rows)}")
          print(f"GITLEAKS_HEAD_FINDINGS={len(head_rows)}")
          print("SECRET_VALUES_EXPOSED_BY_AUDIT=FALSE")
          print("SECRET_FINGERPRINTS_EXPOSED_BY_AUDIT=FALSE")

          if head_rows:
              rule_ids = sorted({str(row.get("RuleID", "UNKNOWN")) for row in head_rows})
              print("GITLEAKS_HEAD_RULE_IDS=" + json.dumps(rule_ids))
              raise SystemExit(1)
          PY
          SCAN_RC=$?
          set -e

          rm -f "$BASE_REPORT" "$HEAD_REPORT" "$BASE_LOG" "$HEAD_LOG"

          if [ "$SCAN_RC" -eq 2 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=ERROR"
            exit 2
          fi
          if [ "$SCAN_RC" -eq 1 ]; then
            echo "CENTINELA_PR_SECRET_SCAN=HEAD_FINDINGS"
            exit 1
          fi

          echo "CENTINELA_PR_SECRET_SCAN=PASS_CLEAN_HEAD"
