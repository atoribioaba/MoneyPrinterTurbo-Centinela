name: Centinela C4 Config Test Reconciliation

on:
  push:
    branches:
      - centinela-engineering/c05-c4-upload-post-manual-fallback-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C4 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Reconcile Upload-Post config contract test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("test/services/test_config.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('            "upload_post_auto_upload",\n', "")

          anchor = '''        assert upload_post_keys <= example_config["app"].keys()\n        assert upload_post_keys.isdisjoint(example_config.get("ui", {}).keys())\n'''
          replacement = anchor + '''        assert "upload_post_auto_upload" not in example_config["app"]\n        assert example_config["app"]["upload_post_youtube_privacy_status"] == "private"\n'''
          if 'assert "upload_post_auto_upload" not in example_config["app"]' not in text:
              if anchor not in text:
                  raise SystemExit("Upload-Post config test anchor changed unexpectedly")
              text = text.replace(anchor, replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate reconciled C4 tests
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q test/services/test_config.py test/services/test_upload_post.py
          uv run --no-sync ruff check test/services/test_config.py test/services/test_upload_post.py app/services/upload_post.py

      - name: Commit only config contract test
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- test/services/test_config.py; then
            echo "C4_CONFIG_TEST_CHANGED=FALSE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/services/test_config.py
          test "$(git diff --cached --name-only)" = "test/services/test_config.py"
          git commit -m "test: enforce manual-only Upload-Post config contract"
          git push origin HEAD:centinela-engineering/c05-c4-upload-post-manual-fallback-v0.1
