name: Centinela B1 Lock Finalizer

on:
  pull_request:
    paths:
      - pyproject.toml
      - requirements.txt
      - uv.lock
      - .github/workflows/centinela-b1-lockgen.yml

# TEMPORARY and branch-scoped: required only to transport the uv-generated lock
# back to the same B1 branch. The job deletes this workflow in the same commit.
permissions:
  contents: write

concurrency:
  group: centinela-b1-lock-finalizer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize-lock:
    name: Finalize python-multipart lock
    if: >-
      github.actor == 'atoribioaba' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'centinela-engineering/c05-b1-python-multipart-v0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact B1 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: centinela-engineering/c05-b1-python-multipart-v0.1
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Regenerate and verify lock
        shell: bash
        env:
          EXPECTED_UV_LOCK_SHA256: "c6c57263e8643a4240403c59581fcf659590e691748c9209592109ab9972a009"
        run: |
          set -euo pipefail
          cp uv.lock "$RUNNER_TEMP/uv.lock.before"
          uv lock --upgrade-package python-multipart==0.0.32
          uv lock --check
          printf '%s  %s\n' "$EXPECTED_UV_LOCK_SHA256" uv.lock | sha256sum --check --strict

          BEFORE_LOCK="$RUNNER_TEMP/uv.lock.before" python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          before = tomllib.loads(Path(os.environ["BEFORE_LOCK"]).read_text(encoding="utf-8"))
          after = tomllib.loads(Path("uv.lock").read_text(encoding="utf-8"))

          def records(lock: dict, name: str) -> list[dict]:
              return [pkg for pkg in lock.get("package", []) if pkg.get("name") == name]

          old_target = records(before, "python-multipart")
          new_target = records(after, "python-multipart")
          if len(old_target) != 1 or old_target[0].get("version") != "0.0.27":
              raise SystemExit("unexpected starting python-multipart lock state")
          if len(new_target) != 1 or new_target[0].get("version") != "0.0.32":
              raise SystemExit("python-multipart was not locked to 0.0.32")

          ignored = {"python-multipart", "moneyprinterturbo"}
          before_other = [pkg for pkg in before.get("package", []) if pkg.get("name") not in ignored]
          after_other = [pkg for pkg in after.get("package", []) if pkg.get("name") not in ignored]
          if before_other != after_other:
              raise SystemExit("non-target dependency drift detected")

          print("PYTHON_MULTIPART_LOCK_BEFORE=0.0.27")
          print("PYTHON_MULTIPART_LOCK_AFTER=0.0.32")
          print("LOCK_NON_TARGET_PACKAGE_DRIFT=0")
          PY

          uv sync --frozen --python 3.11

      - name: Commit generated lock and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/centinela-b1-lockgen.yml
          git add uv.lock .github/workflows/centinela-b1-lockgen.yml
          git diff --cached --check
          git config user.name "Centinela B1 Lock Finalizer"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "security: lock python-multipart 0.0.32"
          git push origin HEAD:centinela-engineering/c05-b1-python-multipart-v0.1
