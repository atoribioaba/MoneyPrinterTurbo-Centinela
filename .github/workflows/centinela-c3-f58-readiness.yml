name: Centinela C3 F58 Readiness Mechanism

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/c3-f58-readiness-v0.1
    paths:
      - .github/workflows/centinela-c3-f58-readiness.yml
      - pyproject.toml
      - uv.lock
      - app/models/v1_readiness_audit.py
      - app/services/v1_readiness_audit.py
      - app/controllers/v1/v1_readiness_audit.py
      - app/models/publication_package.py
      - app/services/publication_package.py
      - app/models/golden_e2e_certification.py
      - app/services/golden_e2e_certification.py
      - app/models/operational_hardening.py
      - app/services/operational_hardening.py
      - app/models/analytics_import_adapter.py
      - app/services/analytics_import_adapter.py
      - app/models/production_orchestrator.py
      - app/services/production_orchestrator.py
      - test/services/test_v1_readiness_audit.py
      - test/services/test_v1_readiness_audit_api.py
      - test/services/test_publication_package.py

permissions:
  contents: read

concurrency:
  group: centinela-c3-f58-${{ github.ref }}
  cancel-in-progress: true

jobs:
  f58-linux:
    name: F58 mechanism / Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Compile F58 surface
        run: >-
          uv run --no-sync python -m compileall
          app/models/v1_readiness_audit.py
          app/services/v1_readiness_audit.py
          app/controllers/v1/v1_readiness_audit.py
          test/services/test_v1_readiness_audit.py
          test/services/test_v1_readiness_audit_api.py
      - name: Ruff F58 surface
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync ruff check
          app/models/v1_readiness_audit.py
          app/services/v1_readiness_audit.py
          app/controllers/v1/v1_readiness_audit.py
          test/services/test_v1_readiness_audit.py
          test/services/test_v1_readiness_audit_api.py
      - name: Run F58 contract
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=f58-linux-${{ matrix.python-version }}.xml
          test/services/test_v1_readiness_audit.py
          test/services/test_v1_readiness_audit_api.py
      - name: Guard freeze semantics
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'architecture_v1_frozen:bool=False' app/models/v1_readiness_audit.py
          grep -q 'freeze_executed:bool=False' app/models/v1_readiness_audit.py
          grep -q 'auto_publication:bool=False' app/models/v1_readiness_audit.py
          grep -q 'human_freeze_approval:bool=False' app/models/v1_readiness_audit.py
          grep -q 'golden_real_e2e_certified' app/services/v1_readiness_audit.py
          grep -q 'manual_publication_package_ready' app/services/v1_readiness_audit.py
          grep -q 'oss_audit_complete' app/services/v1_readiness_audit.py
          echo 'F58_FREEZE_GUARDRAILS=PASS'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f58-contract-linux-${{ matrix.python-version }}-${{ github.run_id }}
          path: f58-linux-${{ matrix.python-version }}.xml
          retention-days: 14

  f58-windows:
    name: F58 mechanism / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.11
      - name: Compile F58 surface
        run: >-
          uv run --no-sync python -m compileall
          app/models/v1_readiness_audit.py
          app/services/v1_readiness_audit.py
          app/controllers/v1/v1_readiness_audit.py
          test/services/test_v1_readiness_audit.py
          test/services/test_v1_readiness_audit_api.py
      - name: Run F58 contract
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=f58-windows-3.11.xml
          test/services/test_v1_readiness_audit.py
          test/services/test_v1_readiness_audit_api.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f58-contract-windows-3.11-${{ github.run_id }}
          path: f58-windows-3.11.xml
          retention-days: 14
