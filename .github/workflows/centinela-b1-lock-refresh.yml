name: Centinela B1 Lock Refresh

on:
  push:
    branches:
      - centinela-engineering/c05-b1-multipart-security-v0.1
    paths:
      - pyproject.toml
      - requirements.txt
      - .github/workflows/centinela-b1-lock-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: centinela-b1-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lock:
    name: Generate, validate and commit uv.lock
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Generate lock
        shell: bash
        run: |
          set -euo pipefail
          uv --version
          uv lock
          uv lock --check

      - name: Verify multipart target in lock
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          text = Path("uv.lock").read_text(encoding="utf-8")
          marker = 'name = "python-multipart"\nversion = "0.0.32"'
          if marker not in text:
              raise SystemExit("python-multipart 0.0.32 not present in generated lock")
          print("B1_MULTIPART_LOCK_TARGET=PASS")
          PY

      - name: Validate frozen environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen
          uv pip show python-multipart

      - name: Hash generated lock
        shell: bash
        run: |
          set -euo pipefail
          sha256sum uv.lock | tee uv-lock.sha256

      - name: Commit only generated uv.lock
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --short -- uv.lock)"
          unexpected="$(git status --short -- ':!uv.lock' ':!.venv' ':!uv-lock.sha256')"
          if [ -n "$unexpected" ]; then
            echo "B1_UNEXPECTED_WORKTREE_CHANGE=TRUE"
            printf '%s\n' "$unexpected"
            exit 2
          fi
          if [ -z "$changed" ]; then
            echo "B1_LOCK_ALREADY_CURRENT=TRUE"
            exit 0
          fi
          git add -- uv.lock
          if [ "$(git diff --cached --name-only)" != "uv.lock" ]; then
            echo "B1_STAGED_SCOPE_INVALID=TRUE"
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lock: refresh python-multipart 0.0.32"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload generated lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: centinela-b1-uv-lock-${{ github.sha }}
          path: |
            uv.lock
            uv-lock.sha256
          retention-days: 7
          if-no-files-found: error
