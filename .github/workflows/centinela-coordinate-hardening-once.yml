name: Centinela Coordinate Evidence One-Shot Hardening

on:
  push:
    branches:
      - centinela-cert/cloud-mobile-v0.1
    paths:
      - .github/workflows/centinela-coordinate-hardening-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: centinela-cert/cloud-mobile-v0.1
  EXPECTED_PARENT: 4a4e38673c69a60f1c3a57eaf168e23cd6c1fdec
  TARGET_FILE: app/services/material_selection.py

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Verify exact starting lineage and clean tree
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(git rev-parse HEAD)"
          PARENT="$(git rev-parse HEAD^)"
          echo "CURRENT=$CURRENT"
          echo "PARENT=$PARENT"
          test "$CURRENT" = "$GITHUB_SHA"
          test "$PARENT" = "$EXPECTED_PARENT"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --frozen --python 3.11

      - name: Provision FFmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Verify every regression test path exists
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            test/services/test_material_selection.py \
            test/services/test_material_selection_c2_11j_contract.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_sol_to_moon_media_cloud_replay.py \
            test/services/test_sol_to_moon_recovery_cloud.py \
            test/services/test_planetary_media_cloud_replay.py \
            test/services/test_planetary_recovery_cloud.py \
            test/services/test_eclipse_media_cloud_replay.py \
            test/services/test_eclipse_recovery_cloud.py \
            test/services/test_constellation_media_cloud_replay.py \
            test/services/test_constellation_recovery_cloud.py \
            test/services/test_deep_sky_media_cloud_replay.py \
            test/services/test_deep_sky_recovery_cloud.py
          do
            test -f "$path" || { echo "MISSING_TEST=$path"; exit 1; }
          done

      - name: Patch only false coordinate-as-positive-evidence gap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/services/material_selection.py')
          text = path.read_text(encoding='utf-8')
          anchor = '    "galaxy",\n    "nebula",\n    "cluster",\n    "mostrando",\n'
          replacement = (
              '    "galaxy",\n'
              '    "nebula",\n'
              '    "cluster",\n'
              '    "coordinate",\n'
              '    "coordinates",\n'
              '    "mostrando",\n'
          )
          assert text.count(anchor) == 1, 'generic specificity anchor changed'
          assert replacement not in text, 'target generic specificity block already hardened'
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify exact diff shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- "$TARGET_FILE"
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only)" = "$TARGET_FILE"
          test "$(git diff --numstat -- "$TARGET_FILE" | awk '{print $1 ":" $2}')" = "2:0"

      - name: Run selector, Lunar grounding, and all closed/current F57 media contracts
        shell: bash
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_material_selection.py
          test/services/test_material_selection_c2_11j_contract.py
          test/services/test_factlock_scientific_visuals.py
          test/services/test_scene_grounding_cloud.py
          test/services/test_lunar_media_cloud_replay.py
          test/services/test_sol_to_moon_media_cloud_replay.py
          test/services/test_sol_to_moon_recovery_cloud.py
          test/services/test_planetary_media_cloud_replay.py
          test/services/test_planetary_recovery_cloud.py
          test/services/test_eclipse_media_cloud_replay.py
          test/services/test_eclipse_recovery_cloud.py
          test/services/test_constellation_media_cloud_replay.py
          test/services/test_constellation_recovery_cloud.py
          test/services/test_deep_sky_media_cloud_replay.py
          test/services/test_deep_sky_recovery_cloud.py

      - name: Re-verify exact diff before commit
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only | grep -v -Fx "$TARGET_FILE" || true)"
          test "$(git diff --numstat -- "$TARGET_FILE" | awk '{print $1 ":" $2}')" = "2:0"
          git diff --check

      - name: Commit only after focused regression passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$TARGET_FILE"
          test "$(git diff --cached --name-only)" = "$TARGET_FILE"
          test "$(git diff --cached --numstat -- "$TARGET_FILE" | awk '{print $1 ":" $2}')" = "2:0"
          git commit -m 'Harden coordinate specificity evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
