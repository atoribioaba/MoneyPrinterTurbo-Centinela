name: Centinela C15 Tailscale Preflight Patch V2

on:
  push:
    branches:
      - centinela-engineering/c05-c15-pc-return-tailscale-readiness-v0.1

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    steps:
      - name: Check out C15
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Execute corrected C15 patch body
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          source = Path(".github/workflows/centinela-c15-tailscale-preflight-patch.yml").read_text(encoding="utf-8")
          start = "      - name: Add read-only Tailscale readiness evidence\n        shell: python\n        run: |\n"
          end = "      - name: Parse PowerShell\n"
          if start not in source or end not in source:
              raise SystemExit("source workflow patch block not found")
          block = source.split(start, 1)[1].split(end, 1)[0]
          code = textwrap.dedent(block)
          lines = code.splitlines()
          if lines and lines[-1].strip() == "PY":
              lines.pop()
          code = "\n".join(lines) + "\n"
          exec(compile(code, "<c15-patch>", "exec"), {"__name__": "__main__"})
      - name: Parse PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/centinela_pc_return_readonly_preflight.ps1",
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Validate C15 preflight
        shell: powershell
        run: |
          uv sync --frozen --group dev --python 3.11
          uv run --python 3.11 pytest -q test/services/test_pc_return_readonly_preflight.py
          uv run --python 3.11 ruff check test/services/test_pc_return_readonly_preflight.py
      - name: Commit only C15 functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/centinela_pc_return_readonly_preflight.ps1 test/services/test_pc_return_readonly_preflight.py
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "scripts/centinela_pc_return_readonly_preflight.ps1 test/services/test_pc_return_readonly_preflight.py "
          git commit -m "preflight: add read-only Tailscale readiness evidence"
          git push
