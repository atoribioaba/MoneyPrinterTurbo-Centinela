name: Centinela C14 Product UI Patch

on:
  push:
    branches:
      - centinela-engineering/c05-c14-instagram-unified-tailscale-funnel-v0.1

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C14
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Expose unified Tailscale readiness in Product UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          ui = Path("webui/product/publication.py")
          text = ui.read_text(encoding="utf-8")

          old = '''    INSTAGRAM_CLIENT_SECRET_ENV,\n    INSTAGRAM_REDIRECT_URI_ENV,\n    callback_runtime_status,\n)\n'''
          new = '''    INSTAGRAM_CLIENT_SECRET_ENV,\n    INSTAGRAM_REDIRECT_URI_ENV,\n    TAILSCALE_PROVIDER,\n    callback_runtime_status,\n)\n'''
          if old not in text:
              raise SystemExit("UI callback import anchor missing")
          text = text.replace(old, new, 1)

          old = '''    ready = bool(\n        callback.get("gate_valid")\n        and callback.get("enabled")\n        and callback.get("configured")\n        and transport_gate_valid\n        and transport_enabled\n        and transport_provider\n    )\n    return {\n'''
          new = '''    callback_provider = str(callback.get("provider") or "")\n    unified_tailscale = bool(\n        callback_provider == TAILSCALE_PROVIDER\n        and transport_provider == TAILSCALE_PROVIDER\n    )\n    ready = bool(\n        callback.get("gate_valid")\n        and callback.get("enabled")\n        and callback.get("configured")\n        and transport_gate_valid\n        and transport_enabled\n        and transport_provider\n    )\n    return {\n'''
          if old not in text:
              raise SystemExit("UI readiness anchor missing")
          text = text.replace(old, new, 1)

          old = '''        "callback_provider": str(callback.get("provider") or ""),\n        "transport_gate_valid": transport_gate_valid,\n'''
          new = '''        "callback_provider": callback_provider,\n        "transport_gate_valid": transport_gate_valid,\n'''
          if old not in text:
              raise SystemExit("UI callback provider return anchor missing")
          text = text.replace(old, new, 1)

          old = '''        "transport_provider": transport_provider,\n        "ready": ready,\n'''
          new = '''        "transport_provider": transport_provider,\n        "unified_tailscale": unified_tailscale,\n        "ready": ready,\n'''
          if old not in text:
              raise SystemExit("UI unified return anchor missing")
          text = text.replace(old, new, 1)

          old = '''    elif not runtime["transport_enabled"]:\n        st.warning("El hosting HTTPS verificable del Reel está desactivado.")\n\n    with st.expander("Configuración local de Instagram", expanded=False):\n'''
          new = '''    elif not runtime["transport_enabled"]:\n        st.warning("El hosting HTTPS verificable del Reel está desactivado.")\n    elif runtime["unified_tailscale"]:\n        st.success(\n            "Tailscale Funnel está seleccionado como transporte unificado para OAuth y MP4."\n        )\n    elif runtime["transport_provider"]:\n        st.info(\n            "Instagram usa Tailscale Funnel para OAuth y un proveedor HTTPS alternativo para el MP4."\n        )\n\n    with st.expander("Configuración local de Instagram", expanded=False):\n'''
          if old not in text:
              raise SystemExit("UI transport status anchor missing")
          text = text.replace(old, new, 1)

          old = '''        st.caption(\n            "Tailscale y el proveedor de hosting del vídeo deben instalarse/configurarse de forma "\n            "explícita en el PC. Centinela no descarga binarios ni guarda tokens por su cuenta."\n        )\n'''
          new = '''        st.caption(\n            "Recomendado: usa tailscale_funnel también en el transporte del MP4 para que una sola "\n            "herramienta cubra OAuth + vídeo. cloudflare_quick y zrok_public quedan como fallback "\n            "explícito. Centinela no descarga binarios ni guarda tokens por su cuenta."\n        )\n'''
          if old not in text:
              raise SystemExit("UI configuration caption anchor missing")
          text = text.replace(old, new, 1)
          ui.write_text(text, encoding="utf-8")

          test = Path("test/services/test_product_instagram_manual_publication_ui.py")
          text = test.read_text(encoding="utf-8")

          old = '''    assert "hosting HTTPS verificable" in source\n    assert "st.session_state" not in source\n'''
          new = '''    assert "hosting HTTPS verificable" in source\n    assert "transporte unificado para OAuth y MP4" in source\n    assert "cloudflare_quick y zrok_public quedan como fallback" in source\n    assert "st.session_state" not in source\n'''
          if old not in text:
              raise SystemExit("UI source assertion anchor missing")
          text = text.replace(old, new, 1)

          old = '''        lambda: SimpleNamespace(enabled=True, provider=SimpleNamespace(value="cloudflare_quick")),\n    )\n\n    status = publication._instagram_product_runtime_status()\n\n    assert status == {\n'''
          new = '''        lambda: SimpleNamespace(enabled=True, provider=SimpleNamespace(value="tailscale_funnel")),\n    )\n\n    status = publication._instagram_product_runtime_status()\n\n    assert status == {\n'''
          if old not in text:
              raise SystemExit("UI runtime provider anchor missing")
          text = text.replace(old, new, 1)

          old = '''        "transport_provider": "cloudflare_quick",\n        "ready": True,\n'''
          new = '''        "transport_provider": "tailscale_funnel",\n        "unified_tailscale": True,\n        "ready": True,\n'''
          if old not in text:
              raise SystemExit("UI runtime expected anchor missing")
          text = text.replace(old, new, 1)

          text += '''\n\ndef test_instagram_runtime_status_marks_alternative_media_transport_as_fallback(monkeypatch):\n    monkeypatch.setattr(\n        publication,\n        "callback_runtime_status",\n        lambda: {\n            "enabled": True,\n            "gate_valid": True,\n            "provider": "tailscale_funnel",\n            "configured": True,\n            "token_persistence": False,\n            "long_lived_token_default": False,\n            "auto_publication": False,\n        },\n    )\n    monkeypatch.setattr(\n        publication,\n        "ephemeral_https_settings",\n        lambda: SimpleNamespace(enabled=True, provider=SimpleNamespace(value="cloudflare_quick")),\n    )\n\n    status = publication._instagram_product_runtime_status()\n    assert status["ready"] is True\n    assert status["unified_tailscale"] is False\n    assert status["transport_provider"] == "cloudflare_quick"\n'''
          test.write_text(text, encoding="utf-8")
          PY
      - name: Validate focused Product UI
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --python 3.11
          uv run --python 3.11 pytest -q \
            test/services/test_product_instagram_manual_publication_ui.py \
            test/services/test_product_manual_publication_ui.py \
            test/services/test_instagram_manual_publication.py \
            test/services/test_instagram_ephemeral_https.py \
            test/services/test_instagram_oauth_callback.py
          uv run --python 3.11 ruff check \
            webui/product/publication.py \
            test/services/test_product_instagram_manual_publication_ui.py
          uv run --python 3.11 python -m py_compile webui/product/publication.py
      - name: Commit only C14 Product UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add webui/product/publication.py test/services/test_product_instagram_manual_publication_ui.py
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "test/services/test_product_instagram_manual_publication_ui.py webui/product/publication.py "
          git commit -m "ui: expose unified Tailscale Instagram transport"
          git push
