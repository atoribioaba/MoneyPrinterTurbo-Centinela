name: Centinela C16 Direct Consumer FactLock Revalidation

on:
  push:
    branches:
      - centinela-engineering/c05-c16-factlock-adversarial-currentline-v0.1

permissions:
  contents: write

jobs:
  harden-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical C16
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Apply direct-consumer semantic revalidation
        shell: python
        run: |
          from pathlib import Path

          visual = Path("app/services/centinela/scientific_visuals.py")
          text = visual.read_text(encoding="utf-8")
          old = "from PIL import Image, ImageDraw, ImageFont\n\nfrom app.models.astromedia import Sidecar\n"
          new = "from PIL import Image, ImageDraw, ImageFont\nfrom pydantic import ValidationError\n\nfrom app.models.astromedia import Sidecar\n"
          if old not in text:
              raise SystemExit("scientific_visuals import anchor missing")
          text = text.replace(old, new, 1)
          old = '''    if not isinstance(fact_lock, FactLock):\n        raise TypeError("fact_lock must be FactLock")\n    fact_id = str(fact_id or "").strip()\n'''
          new = '''    if not isinstance(fact_lock, FactLock):\n        raise TypeError("fact_lock must be FactLock")\n    try:\n        fact_lock = FactLock.model_validate(fact_lock.model_dump(mode="json"))\n    except (AttributeError, TypeError, ValueError, ValidationError) as exc:\n        raise ScientificVisualError(\n            "FactLock semantic integrity validation failed"\n        ) from exc\n    fact_id = str(fact_id or "").strip()\n'''
          if old not in text:
              raise SystemExit("scientific_visuals boundary anchor missing")
          text = text.replace(old, new, 1)
          visual.write_text(text, encoding="utf-8")

          scenes = Path("app/services/centinela/av_runtime/scenes.py")
          text = scenes.read_text(encoding="utf-8")
          old = '''def build_scene_plan(\n    final_script: FinalScript,\n    fact_lock: FactLock,\n) -> AstronomyVideoPlan:\n    if final_script.fact_lock_hash != fact_lock.context_hash:\n'''
          new = '''def build_scene_plan(\n    final_script: FinalScript,\n    fact_lock: FactLock,\n) -> AstronomyVideoPlan:\n    try:\n        fact_lock = FactLock.model_validate(fact_lock.model_dump(mode="json"))\n    except (AttributeError, TypeError, ValueError, ValidationError) as exc:\n        raise SceneAdapterError(\n            "FactLock semantic integrity validation failed"\n        ) from exc\n    if final_script.fact_lock_hash != fact_lock.context_hash:\n'''
          if old not in text:
              raise SystemExit("scene plan boundary anchor missing")
          text = text.replace(old, new, 1)
          scenes.write_text(text, encoding="utf-8")

          visual_test = Path("test/services/test_factlock_scientific_visuals.py")
          text = visual_test.read_text(encoding="utf-8")
          addition = '''\n\ndef test_factlock_scientific_visual_revalidates_tampered_model_copy(tmp_path):\n    valid = _fact_lock()\n    facts = list(valid.facts)\n    facts[0] = facts[0].model_copy(update={"value": 0.75})\n    tampered = valid.model_copy(update={"facts": facts})\n\n    with pytest.raises(ScientificVisualError, match="semantic integrity"):\n        render_factlock_scientific_visual(\n            tampered,\n            "moon:angular_diameter_deg",\n            tmp_path,\n        )\n\n    assert list(tmp_path.iterdir()) == []\n'''
          if "test_factlock_scientific_visual_revalidates_tampered_model_copy" in text:
              raise SystemExit("scientific visual adversarial test already exists")
          visual_test.write_text(text + addition, encoding="utf-8")

          scene_test = Path("test/services/test_scene_grounding_cloud.py")
          text = scene_test.read_text(encoding="utf-8")
          old = "from datetime import datetime, timezone\n\nfrom app.models.astronomy import ScientificStatus, SourceReference\n"
          new = "from datetime import datetime, timezone\n\nimport pytest\n\nfrom app.models.astronomy import ScientificStatus, SourceReference\n"
          if old not in text:
              raise SystemExit("scene test pytest anchor missing")
          text = text.replace(old, new, 1)
          old = "from app.services.centinela.av_runtime.scenes import build_scene_plan\n"
          new = "from app.services.centinela.av_runtime.scenes import SceneAdapterError, build_scene_plan\n"
          if old not in text:
              raise SystemExit("scene test import anchor missing")
          text = text.replace(old, new, 1)
          addition = '''\n\ndef test_build_scene_plan_revalidates_tampered_factlock_model_copy():\n    valid = _fact_lock()\n    facts = list(valid.facts)\n    facts[0] = facts[0].model_copy(update={"value": 999999.0})\n    tampered = valid.model_copy(update={"facts": facts})\n\n    with pytest.raises(SceneAdapterError, match="semantic integrity"):\n        build_scene_plan(_final_script(), tampered)\n'''
          if "test_build_scene_plan_revalidates_tampered_factlock_model_copy" in text:
              raise SystemExit("scene adversarial test already exists")
          scene_test.write_text(text + addition, encoding="utf-8")
      - name: Install locked dev environment
        run: uv sync --frozen --group dev --python 3.11
      - name: Run focused C16 consumer regressions
        run: |
          uv run --python 3.11 pytest -q \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_factlock_semantic_integrity_c16.py \
            test/services/test_factlock_pre_llm_revalidation_c16.py
      - name: Ruff changed Python files
        run: |
          uv run --python 3.11 ruff check \
            app/services/centinela/scientific_visuals.py \
            app/services/centinela/av_runtime/scenes.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_scene_grounding_cloud.py
      - name: Compile changed Python files
        run: |
          uv run --python 3.11 python -m py_compile \
            app/services/centinela/scientific_visuals.py \
            app/services/centinela/av_runtime/scenes.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_scene_grounding_cloud.py
      - name: Commit only C16 functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/centinela/scientific_visuals.py \
            app/services/centinela/av_runtime/scenes.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_scene_grounding_cloud.py
          git diff --cached --quiet && exit 0
          git commit -m "security: revalidate FactLock at direct consumer boundaries"
          git push
