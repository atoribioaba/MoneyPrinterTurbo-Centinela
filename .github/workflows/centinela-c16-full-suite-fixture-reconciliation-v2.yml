name: Centinela C16 Full Suite Fixture Reconciliation V2

on:
  push:
    branches:
      - centinela-engineering/c05-c16-factlock-semantic-integrity-v0.1

permissions:
  contents: write

jobs:
  reconcile-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out C16
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Reconcile canonical FactLock producer and legacy test fixtures
        shell: python
        run: |
          from pathlib import Path
          import base64

          helper_b64 = ""
          helper = Path("test/services/factlock_test_utils.py")
          helper.write_bytes(base64.b64decode(helper_b64))

          fixture_specs = {
              "test/services/test_av_runtime.py": ("return FactLock(", "return make_semantically_valid_fact_lock("),
              "test/services/test_factlock_scientific_visuals.py": ("return FactLock(", "return make_semantically_valid_fact_lock("),
              "test/services/test_factlock_writer_room_adversarial.py": ("return FactLock(", "return make_semantically_valid_fact_lock("),
              "test/services/test_lunar_media_cloud_replay.py": ("return FactLock(", "return make_semantically_valid_fact_lock("),
              "test/services/test_scene_grounding_cloud.py": ("return FactLock(", "return make_semantically_valid_fact_lock("),
              "test/services/test_writer_room_adversarial_regression.py": ("return FactLock(", "return make_semantically_valid_fact_lock("),
              "test/services/test_c3_astronomy_research_adapters.py": ("fact_lock = FactLock(", "fact_lock = make_semantically_valid_fact_lock("),
              "test/services/test_scientific_conflict_resolver.py": ("base_fact_lock = FactLock(", "base_fact_lock = make_semantically_valid_fact_lock("),
          }
          import_line = "from test.services.factlock_test_utils import make_semantically_valid_fact_lock\n"
          future_line = "from __future__ import annotations\n"
          for filename, (old, new) in fixture_specs.items():
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if import_line not in text:
                  if future_line in text:
                      text = text.replace(future_line, future_line + "\n" + import_line, 1)
                  else:
                      text = import_line + "\n" + text
              if old not in text:
                  raise SystemExit(f"fixture anchor missing: {filename}: {old}")
              text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")

          adapter = Path("app/services/centinela/research_adapters/spine_adapter.py")
          text = adapter.read_text(encoding="utf-8")
          imports = "import hashlib\nimport json\n"
          if imports not in text:
              raise SystemExit("research adapter hash imports anchor missing")
          text = text.replace(imports, "", 1)
          old_import = "from app.services.centinela.writer_room.models import FactLock\n"
          new_import = "from app.services.centinela.writer_room.models import (\n    FactLock,\n    compute_fact_lock_context_hash,\n)\n"
          if old_import not in text:
              raise SystemExit("research adapter writer_room import anchor missing")
          text = text.replace(old_import, new_import, 1)
          start = text.find("def _hash_fact_lock(")
          end = text.find("\n\nclass C3ExternalResearchFactLockAdapter", start)
          if start < 0 or end < 0:
              raise SystemExit("research adapter duplicate hash helper anchor missing")
          text = text[:start] + text[end + 2:]
          old_union = "        source_ids = list(dict.fromkeys(source_ids))\n        if len(facts) > 256 or len(sources) > 128 or len(source_ids) > 128:\n"
          new_union = "        source_ids = sorted(\n            {\n                source_id.strip()\n                for fact in facts\n                for source_id in fact.source_ids\n                if source_id.strip()\n            }\n        )\n        if len(facts) > 256 or len(sources) > 128 or len(source_ids) > 128:\n"
          if old_union not in text:
              raise SystemExit("research adapter source union anchor missing")
          text = text.replace(old_union, new_union, 1)
          old_hash = '"context_hash": _hash_fact_lock(facts, source_ids),'
          new_hash = '"context_hash": compute_fact_lock_context_hash(facts, source_ids),'
          if old_hash not in text:
              raise SystemExit("research adapter hash call anchor missing")
          text = text.replace(old_hash, new_hash, 1)
          adapter.write_text(text, encoding="utf-8")
      - name: Install locked dev environment
        run: uv sync --frozen --group dev --python 3.11
      - name: Run all previously failing C16 suites
        run: |
          uv run --python 3.11 pytest -q \
            test/services/test_av_runtime.py \
            test/services/test_c3_astronomy_research_adapters.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_factlock_writer_room_adversarial.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_scientific_conflict_resolver.py \
            test/services/test_writer_room_adversarial_regression.py \
            test/services/test_factlock_semantic_integrity.py \
            test/services/test_writer_room.py
      - name: Ruff reconciled files
        run: |
          uv run --python 3.11 ruff check \
            app/services/centinela/research_adapters/spine_adapter.py \
            test/services/factlock_test_utils.py \
            test/services/test_av_runtime.py \
            test/services/test_c3_astronomy_research_adapters.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_factlock_writer_room_adversarial.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_scientific_conflict_resolver.py \
            test/services/test_writer_room_adversarial_regression.py
      - name: Compile reconciled files
        run: |
          uv run --python 3.11 python -m py_compile \
            app/services/centinela/research_adapters/spine_adapter.py \
            test/services/factlock_test_utils.py \
            test/services/test_av_runtime.py \
            test/services/test_c3_astronomy_research_adapters.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_factlock_writer_room_adversarial.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_scientific_conflict_resolver.py \
            test/services/test_writer_room_adversarial_regression.py
      - name: Commit C16 reconciliation only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/centinela/research_adapters/spine_adapter.py \
            test/services/factlock_test_utils.py \
            test/services/test_av_runtime.py \
            test/services/test_c3_astronomy_research_adapters.py \
            test/services/test_factlock_scientific_visuals.py \
            test/services/test_factlock_writer_room_adversarial.py \
            test/services/test_lunar_media_cloud_replay.py \
            test/services/test_scene_grounding_cloud.py \
            test/services/test_scientific_conflict_resolver.py \
            test/services/test_writer_room_adversarial_regression.py
          git diff --cached --quiet && exit 0
          git commit -m "test: reconcile FactLock fixtures with semantic integrity"
          git push
