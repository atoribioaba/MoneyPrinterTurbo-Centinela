name: Centinela C8 Desktop OAuth Boundary

on:
  push:
    branches:
      - centinela-engineering/c05-c8-desktop-oauth-boundary-v0.1

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C8 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.11
      - name: Run C8 OAuth and publication compatibility tests
        run: >-
          uv run --no-sync pytest -q
          test/services/test_social_oauth.py
          test/services/test_social_publication.py
          test/services/test_manual_publication.py
          test/services/test_product_manual_publication_ui.py
      - name: Ruff C8 files
        run: >-
          uv run --no-sync ruff check
          app/services/social_oauth.py
          test/services/test_social_oauth.py
      - name: Compile C8 module
        run: uv run --no-sync python -m py_compile app/services/social_oauth.py
