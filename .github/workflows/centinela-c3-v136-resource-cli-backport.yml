name: Centinela C3 v1.3.6 Resource and CLI Backport

on:
  push:
    branches:
      - centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C3 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Apply resource-close and UTF-8 fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          voice = Path("app/services/voice.py")
          text = voice.read_text(encoding="utf-8")
          old = (
              '            audio_clip = AudioFileClip(voice_file)\n'
              '            audio_duration = audio_clip.duration\n'
              '            audio_clip.close()'
          )
          new = (
              '            audio_clip = AudioFileClip(voice_file)\n'
              '            try:\n'
              '                audio_duration = audio_clip.duration\n'
              '            finally:\n'
              '                audio_clip.close()'
          )
          count = text.count(old)
          if count:
              if count != 3:
                  raise SystemExit(f"expected three remaining AudioFileClip blocks, found {count}")
              text = text.replace(old, new)
              voice.write_text(text, encoding="utf-8")
          elif text.count(new) < 3:
              raise SystemExit("resource-close backport is neither pending nor already applied")

          cli = Path("cli.py")
          text = cli.read_text(encoding="utf-8")
          if '\nimport sys\n' not in text:
              anchor = 'import shutil\n'
              if text.count(anchor) != 1:
                  raise SystemExit("CLI import anchor mismatch")
              text = text.replace(anchor, anchor + 'import sys\n', 1)

          function = '''\n\ndef _force_utf8_console() -> None:\n    """Make stdout/stderr UTF-8 before the CLI prints user or log content."""\n    for stream in (sys.stdout, sys.stderr):\n        reconfigure = getattr(stream, "reconfigure", None)\n        if reconfigure is None:\n            continue\n        try:\n            reconfigure(encoding="utf-8", errors="replace")\n        except (ValueError, OSError):\n            continue\n'''
          old_main = '\n\nif __name__ == "__main__":\n    raise SystemExit(run_cli())\n'
          new_main = function + '\n\nif __name__ == "__main__":\n    _force_utf8_console()\n    raise SystemExit(run_cli())\n'
          if 'def _force_utf8_console()' not in text:
              if text.count(old_main) != 1:
                  raise SystemExit("CLI main anchor mismatch")
              text = text.replace(old_main, new_main, 1)
          elif '_force_utf8_console()\n    raise SystemExit(run_cli())' not in text:
              raise SystemExit("CLI UTF-8 helper exists but is not called from main")
          cli.write_text(text, encoding="utf-8")
          PY

      - name: Validate focused regressions
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q \
            test/services/test_voice.py \
            test/services/test_cli.py \
            test/services/test_upstream_v136_cli_utf8.py
          uv run --no-sync ruff check \
            app/services/voice.py cli.py test/services/test_upstream_v136_cli_utf8.py

      - name: Commit only production backports
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- app/services/voice.py cli.py)"
          if [ -z "$changed" ]; then
            echo "C3_RESOURCE_CLI_PATCH_CHANGED=FALSE"
            exit 0
          fi
          printf '%s\n' "$changed"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/services/voice.py cli.py
          unexpected="$(git diff --cached --name-only | grep -Ev '^(app/services/voice.py|cli.py)$' || true)"
          test -z "$unexpected"
          git commit -m "fix: backport v1.3.6 resource cleanup and Windows UTF-8 CLI"
          git push origin HEAD:centinela-engineering/c05-c3-upstream-v1.3.6-security-sync-v0.1
