name: Centinela Public Secret Audit

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/c3-f58-readiness-v0.1
    paths:
      - .github/workflows/centinela-public-secret-audit.yml
      - .github/gitleaks-centinela.toml

permissions:
  contents: read

concurrency:
  group: centinela-public-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-audit:
    name: Full-history + current-tree secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branch refs for history coverage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          echo "CENTINELA_SECRET_AUDIT_COMMIT_COUNT=$(git rev-list --all --count)"

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p .centinela-tools/gitleaks
          tar -xzf "$archive" -C .centinela-tools/gitleaks gitleaks
          .centinela-tools/gitleaks/gitleaks version | grep -F "$GITLEAKS_VERSION"

      - name: Validate Gitleaks detector canaries
        shell: bash
        run: |
          set -euo pipefail
          GITLEAKS=".centinela-tools/gitleaks/gitleaks"
          POLICY_CONFIG="$GITHUB_WORKSPACE/.github/gitleaks-centinela.toml"
          CANARY_DIR="$RUNNER_TEMP/centinela-gitleaks-canary"
          CANARY_REPORT="$RUNNER_TEMP/gitleaks-canary.json"
          CANARY_LOG="$RUNNER_TEMP/gitleaks-canary.log"
          test -f "$POLICY_CONFIG"
          mkdir -p "$CANARY_DIR"
          CANARY_DIR="$CANARY_DIR" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CANARY_DIR"])
          prefix = "".join(chr(value) for value in (103, 104, 112, 95))
          pat_pieces = ("wA9mK2", "pLxN4v", "RtQzY6", "bC8dEf", "GhJlM0", "oPq1rS")
          (root / "provider.txt").write_text(prefix + "".join(pat_pieces) + "\n", encoding="utf-8")

          credential_key = "auth" + "_token"
          generic_secret = "".join(("Q7m2", "N9v4", "R6t8", "K3p5", "X1c9", "B4d7", "H2j6", "M8s0"))
          payload = {
              "service": "svc",
              "operation": "AuthService.register",
              credential_key: generic_secret,
          }
          (root / "generic-cross-field.json").write_text(
              json.dumps(payload, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY
          set +e
          "$GITLEAKS" dir \
            --config "$POLICY_CONFIG" \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$CANARY_REPORT" \
            "$CANARY_DIR" >"$CANARY_LOG" 2>&1
          CANARY_RC=$?
          CANARY_RC="$CANARY_RC" CANARY_REPORT="$CANARY_REPORT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["CANARY_REPORT"])
          rows = json.loads(report.read_text(encoding="utf-8")) if report.exists() else []
          ok = int(os.environ["CANARY_RC"]) == 1 and isinstance(rows, list)
          provider_ok = any(str(row.get("File", "")).endswith("provider.txt") for row in rows) if ok else False
          generic_ok = any(
              str(row.get("File", "")).endswith("generic-cross-field.json")
              and str(row.get("RuleID", "")) == "generic-api-key"
              for row in rows
          ) if ok else False
          raise SystemExit(0 if provider_ok and generic_ok else 2)
          PY
          VALIDATION_RC=$?
          set -e
          rm -rf "$CANARY_DIR" "$CANARY_REPORT" "$CANARY_LOG"
          if [ "$VALIDATION_RC" -ne 0 ]; then
            echo "GITLEAKS_CANARIES=FAIL"
            exit 2
          fi
          echo "GITLEAKS_PROVIDER_CANARY=PASS"
          echo "GITLEAKS_GENERIC_CROSS_FIELD_CANARY=PASS"

      - name: Scan full Git history and current tree with redaction
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          GITLEAKS=".centinela-tools/gitleaks/gitleaks"
          POLICY_CONFIG="$GITHUB_WORKSPACE/.github/gitleaks-centinela.toml"

          set +e
          "$GITLEAKS" git \
            --config "$POLICY_CONFIG" \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path gitleaks-history.json \
            . >gitleaks-history.log 2>&1
          HISTORY_RC=$?

          "$GITLEAKS" dir \
            --config "$POLICY_CONFIG" \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path gitleaks-current.json \
            . >gitleaks-current.log 2>&1
          CURRENT_RC=$?
          set -e

          HISTORY_RC="$HISTORY_RC" CURRENT_RC="$CURRENT_RC" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_report(path: str) -> list[dict]:
              p = Path(path)
              if not p.exists() or not p.read_text(encoding="utf-8").strip():
                  return []
              data = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  raise SystemExit(f"Unexpected Gitleaks report shape: {path}")
              return data

          def safe_rows(rows: list[dict]) -> list[dict]:
              result = []
              seen = set()
              for row in rows:
                  item = {
                      "rule_id": str(row.get("RuleID", "UNKNOWN")),
                      "file": str(row.get("File", "UNKNOWN")),
                      "commit": str(row.get("Commit", ""))[:12],
                  }
                  key = tuple(item.values())
                  if key not in seen:
                      seen.add(key)
                      result.append(item)
              return result

          history = load_report("gitleaks-history.json")
          current = load_report("gitleaks-current.json")
          summary = {
              "audit": "CENTINELA_PUBLIC_SECRET_AUDIT",
              "gitleaks_version": "8.30.1",
              "policy": ".github/gitleaks-centinela.toml",
              "generic_api_key_issue_2223_override": True,
              "redaction_percent": 100,
              "history_exit_code": int(os.environ["HISTORY_RC"]),
              "current_tree_exit_code": int(os.environ["CURRENT_RC"]),
              "history_findings": len(history),
              "current_tree_findings": len(current),
              "history_locations_redacted": safe_rows(history),
              "current_tree_locations_redacted": safe_rows(current),
              "secret_values_persisted": False,
              "raw_reports_uploaded": False,
          }
          Path("centinela-secret-audit-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(f"GITLEAKS_HISTORY_FINDINGS={len(history)}")
          print(f"GITLEAKS_CURRENT_TREE_FINDINGS={len(current)}")
          print("SECRET_VALUES_EXPOSED_BY_AUDIT=FALSE")
          PY

          echo "history_rc=$HISTORY_RC" >> "$GITHUB_OUTPUT"
          echo "current_rc=$CURRENT_RC" >> "$GITHUB_OUTPUT"

          rm -f gitleaks-history.json gitleaks-current.json gitleaks-history.log gitleaks-current.log

          if [ "$HISTORY_RC" -gt 1 ] || [ "$CURRENT_RC" -gt 1 ]; then
            echo "CENTINELA_PUBLIC_SECRET_AUDIT=ERROR"
            exit 2
          fi
          if [ "$HISTORY_RC" -eq 1 ] || [ "$CURRENT_RC" -eq 1 ]; then
            echo "CENTINELA_PUBLIC_SECRET_AUDIT=FINDINGS"
            exit 1
          fi

          echo "CENTINELA_PUBLIC_SECRET_AUDIT=PASS"

      - name: Upload redacted audit summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: centinela-public-secret-audit-${{ github.run_id }}
          path: centinela-secret-audit-summary.json
          retention-days: 14
          if-no-files-found: error
