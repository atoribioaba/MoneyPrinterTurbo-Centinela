name: Centinela Public Secret Audit

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/c3-f58-readiness-v0.1
    paths:
      - .github/workflows/centinela-public-secret-audit.yml

permissions:
  contents: read

concurrency:
  group: centinela-public-secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-audit:
    name: Full-history + current-tree secret audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branch refs for history coverage
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          echo "CENTINELA_SECRET_AUDIT_COMMIT_COUNT=$(git rev-list --all --count)"

      - name: Install pinned Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p .centinela-tools/gitleaks
          tar -xzf "$archive" -C .centinela-tools/gitleaks gitleaks
          .centinela-tools/gitleaks/gitleaks version | grep -F "$GITLEAKS_VERSION"

      - name: Scan full Git history and current tree with redaction
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          GITLEAKS=".centinela-tools/gitleaks/gitleaks"

          set +e
          "$GITLEAKS" git \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path gitleaks-history.json \
            . >gitleaks-history.log 2>&1
          HISTORY_RC=$?

          "$GITLEAKS" dir \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path gitleaks-current.json \
            . >gitleaks-current.log 2>&1
          CURRENT_RC=$?
          set -e

          HISTORY_RC="$HISTORY_RC" CURRENT_RC="$CURRENT_RC" python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_report(path: str) -> list[dict]:
              p = Path(path)
              if not p.exists() or not p.read_text(encoding="utf-8").strip():
                  return []
              data = json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(data, list):
                  raise SystemExit(f"Unexpected Gitleaks report shape: {path}")
              return data

          def safe_rows(rows: list[dict]) -> list[dict]:
              # Deliberately omit Secret, Match, Line, columns, entropy, author and email.
              result = []
              seen = set()
              for row in rows:
                  item = {
                      "rule_id": str(row.get("RuleID", "UNKNOWN")),
                      "file": str(row.get("File", "UNKNOWN")),
                      "commit": str(row.get("Commit", ""))[:12],
                  }
                  key = tuple(item.values())
                  if key not in seen:
                      seen.add(key)
                      result.append(item)
              return result

          history = load_report("gitleaks-history.json")
          current = load_report("gitleaks-current.json")
          summary = {
              "audit": "CENTINELA_PUBLIC_SECRET_AUDIT",
              "gitleaks_version": "8.30.1",
              "redaction_percent": 100,
              "history_exit_code": int(os.environ["HISTORY_RC"]),
              "current_tree_exit_code": int(os.environ["CURRENT_RC"]),
              "history_findings": len(history),
              "current_tree_findings": len(current),
              "history_locations_redacted": safe_rows(history),
              "current_tree_locations_redacted": safe_rows(current),
              "secret_values_persisted": False,
              "raw_reports_uploaded": False,
          }
          Path("centinela-secret-audit-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          print(f"GITLEAKS_HISTORY_FINDINGS={len(history)}")
          print(f"GITLEAKS_CURRENT_TREE_FINDINGS={len(current)}")
          print("SECRET_VALUES_EXPOSED_BY_AUDIT=FALSE")
          PY

          echo "history_rc=$HISTORY_RC" >> "$GITHUB_OUTPUT"
          echo "current_rc=$CURRENT_RC" >> "$GITHUB_OUTPUT"

          if [ "$HISTORY_RC" -gt 1 ] || [ "$CURRENT_RC" -gt 1 ]; then
            echo "CENTINELA_PUBLIC_SECRET_AUDIT=ERROR"
            exit 2
          fi
          if [ "$HISTORY_RC" -eq 1 ] || [ "$CURRENT_RC" -eq 1 ]; then
            echo "CENTINELA_PUBLIC_SECRET_AUDIT=FINDINGS"
            exit 1
          fi

          echo "CENTINELA_PUBLIC_SECRET_AUDIT=PASS"

      - name: Upload redacted audit summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: centinela-public-secret-audit-${{ github.run_id }}
          path: centinela-secret-audit-summary.json
          retention-days: 14
          if-no-files-found: error
