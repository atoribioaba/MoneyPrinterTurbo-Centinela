name: Centinela Python SBOM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/centinela-c3-sbom.yml
      - pyproject.toml
      - uv.lock
      - requirements.txt
  push:
    branches:
      - main
      - centinela-edition/material-pipeline-v0.2
    paths:
      - .github/workflows/centinela-c3-sbom.yml
      - pyproject.toml
      - uv.lock
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: centinela-sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom-linux-python311:
    name: SBOM / Linux / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: true

      - name: Resolve exact production environment
        run: uv sync --frozen --python 3.11 --no-dev --no-extra twelvelabs

      - name: Export resolved Python inventory
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import importlib.metadata as metadata
          import json
          import platform
          import sys
          from pathlib import Path

          packages = sorted(
              (
                  {
                      "name": dist.metadata.get("Name") or dist.metadata.get("Summary") or "UNKNOWN",
                      "version": dist.version,
                  }
                  for dist in metadata.distributions()
              ),
              key=lambda row: (row["name"].casefold(), row["version"]),
          )
          payload = {
              "source_commit": "${{ github.sha }}",
              "python": sys.version,
              "python_executable": sys.executable,
              "platform": platform.platform(),
              "package_count": len(packages),
              "packages": packages,
          }
          Path("centinela-python-inventory.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(f"CENTINELA_RESOLVED_PACKAGE_COUNT={len(packages)}")
          PY

      - name: Generate reproducible CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_EXE="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          uvx --from cyclonedx-bom==7.3.1 cyclonedx-py environment \
            --spec-version 1.6 \
            --output-format JSON \
            --output-reproducible \
            --gather-license-texts \
            --validate \
            --pyproject pyproject.toml \
            --output-file centinela-python-sbom.cdx.json \
            "$PYTHON_EXE"

      - name: Validate and hash evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          bom = json.loads(Path("centinela-python-sbom.cdx.json").read_text(encoding="utf-8"))
          inventory = json.loads(Path("centinela-python-inventory.json").read_text(encoding="utf-8"))
          assert bom.get("bomFormat") == "CycloneDX"
          assert bom.get("specVersion") == "1.6"
          assert inventory.get("source_commit")
          assert inventory.get("package_count", 0) > 0
          assert len(inventory.get("packages", [])) == inventory["package_count"]
          assert bom.get("components")
          print("CENTINELA_SBOM_STRUCTURE=PASS")
          PY
          sha256sum \
            pyproject.toml \
            uv.lock \
            requirements.txt \
            centinela-python-sbom.cdx.json \
            centinela-python-inventory.json \
            > centinela-sbom-sha256.txt
          cat centinela-sbom-sha256.txt

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: centinela-python-sbom-${{ github.run_id }}
          path: |
            centinela-python-sbom.cdx.json
            centinela-python-inventory.json
            centinela-sbom-sha256.txt
          retention-days: 30
          if-no-files-found: error
