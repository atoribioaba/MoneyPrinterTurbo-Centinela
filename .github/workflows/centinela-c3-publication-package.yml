name: Centinela C3 Publication Package v0.2

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/c3-f58-readiness-v0.1
    paths:
      - .github/workflows/centinela-c3-publication-package.yml
      - app/models/publication_package.py
      - app/services/publication_package.py
      - app/controllers/v1/publication_package.py
      - app/services/v1_readiness_audit.py
      - scripts/centinela_publication_package_cloud_dry_run.py
      - test/services/test_publication_package.py
      - test/services/test_publication_package_api.py
      - test/services/test_v1_readiness_audit.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: centinela-c3-publication-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-linux:
    name: Publication Package / Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile publication package surface
        run: >-
          uv run --no-sync python -m compileall
          app/models/publication_package.py
          app/services/publication_package.py
          app/controllers/v1/publication_package.py
          app/services/v1_readiness_audit.py
          scripts/centinela_publication_package_cloud_dry_run.py
          test/services/test_publication_package.py
          test/services/test_publication_package_api.py
          test/services/test_v1_readiness_audit.py

      - name: Ruff publication package surface
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync ruff check
          app/models/publication_package.py
          app/services/publication_package.py
          app/controllers/v1/publication_package.py
          app/services/v1_readiness_audit.py
          scripts/centinela_publication_package_cloud_dry_run.py
          test/services/test_publication_package.py
          test/services/test_publication_package_api.py
          test/services/test_v1_readiness_audit.py

      - name: Run publication package contract
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=publication-package-linux-${{ matrix.python-version }}.xml
          test/services/test_publication_package.py
          test/services/test_publication_package_api.py
          test/services/test_v1_readiness_audit.py

      - name: Run cloud-only publication package dry run
        run: >-
          uv run --no-sync python -X utf8
          scripts/centinela_publication_package_cloud_dry_run.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-package-linux-${{ matrix.python-version }}-${{ github.run_id }}
          path: publication-package-linux-${{ matrix.python-version }}.xml
          retention-days: 14
          if-no-files-found: warn

  publication-windows:
    name: Publication Package / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.11

      - name: Compile publication package surface
        run: >-
          uv run --no-sync python -m compileall
          app/models/publication_package.py
          app/services/publication_package.py
          app/controllers/v1/publication_package.py
          app/services/v1_readiness_audit.py
          scripts/centinela_publication_package_cloud_dry_run.py
          test/services/test_publication_package.py
          test/services/test_publication_package_api.py
          test/services/test_v1_readiness_audit.py

      - name: Run publication package contract
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=publication-package-windows-3.11.xml
          test/services/test_publication_package.py
          test/services/test_publication_package_api.py
          test/services/test_v1_readiness_audit.py

      - name: Run cloud-only publication package dry run
        run: >-
          uv run --no-sync python -X utf8
          scripts/centinela_publication_package_cloud_dry_run.py

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-package-windows-3.11-${{ github.run_id }}
          path: publication-package-windows-3.11.xml
          retention-days: 14
          if-no-files-found: warn
