name: Centinela C9 Reconcile Hardening

on:
  push:
    branches:
      - centinela-engineering/c05-c9-product-oauth-manual-publication-v0.1

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reconciled C9
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Close loopback before token exchange and strengthen tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          prod = Path("app/services/social_oauth_desktop.py")
          text = prod.read_text(encoding="utf-8")
          old = '''        callback = receiver.wait(timeout_seconds=timeout_seconds)\n        if credentials.platform == OAuthPlatform.YOUTUBE:\n            token = exchange_youtube_authorization_code(\n                request,\n                callback,\n                client_id=credentials.client_identifier,\n                client_secret=credentials.client_secret,\n                session=session,\n            )\n        else:\n            token = exchange_tiktok_authorization_code(\n                request,\n                callback,\n                client_key=credentials.client_identifier,\n                client_secret=credentials.client_secret,\n                session=session,\n            )\n\n    return DesktopOAuthSessionResult(token=token, platform=credentials.platform)\n'''
          new = '''        callback = receiver.wait(timeout_seconds=timeout_seconds)\n\n    # The local callback listener is closed before any external token exchange.\n    # This keeps the loopback attack surface one-shot and as short-lived as possible.\n    if credentials.platform == OAuthPlatform.YOUTUBE:\n        token = exchange_youtube_authorization_code(\n            request,\n            callback,\n            client_id=credentials.client_identifier,\n            client_secret=credentials.client_secret,\n            session=session,\n        )\n    else:\n        token = exchange_tiktok_authorization_code(\n            request,\n            callback,\n            client_key=credentials.client_identifier,\n            client_secret=credentials.client_secret,\n            session=session,\n        )\n\n    return DesktopOAuthSessionResult(token=token, platform=credentials.platform)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("C9 token-exchange lifecycle anchor not found")
          prod.write_text(text, encoding="utf-8")

          tests = Path("test/services/test_social_oauth_desktop.py")
          test_text = tests.read_text(encoding="utf-8")
          old_post = '''    def post(self, url, **kwargs):\n        self.calls.append({"url": url, **kwargs})\n        return self.response\n'''
          new_post = '''    def post(self, url, **kwargs):\n        assert _FakeReceiver.instances\n        assert _FakeReceiver.instances[-1].exited is True\n        self.calls.append({"url": url, **kwargs})\n        return self.response\n'''
          if old_post in test_text:
              test_text = test_text.replace(old_post, new_post, 1)
          elif new_post not in test_text:
              raise SystemExit("C9 fake-session lifecycle anchor not found")
          tests.write_text(test_text, encoding="utf-8")

          product_tests = Path("test/services/test_product_manual_publication_ui.py")
          product_text = product_tests.read_text(encoding="utf-8")
          marker = "def test_product_oauth_flow_preverifies_before_auth_and_reuses_c6_gate("
          if marker not in product_text:
              product_text += '''\n\ndef test_product_oauth_flow_preverifies_before_auth_and_reuses_c6_gate(monkeypatch):\n    store = object()\n    service = SimpleNamespace(store=store)\n    order = []\n    sentinel = object()\n\n    def fake_verify(store_arg, project_id):\n        assert store_arg is store\n        assert project_id == "project-c9"\n        order.append("verify")\n\n    def fake_authorize(oauth_platform):\n        assert oauth_platform == publication.OAuthPlatform.YOUTUBE\n        order.append("oauth")\n        return SimpleNamespace(token=SimpleNamespace(access_token="runtime-token"))\n\n    def fake_execute(service_arg, project_id, platform, **kwargs):\n        assert service_arg is service\n        assert project_id == "project-c9"\n        assert platform == publication.ManualPublicationPlatform.YOUTUBE\n        assert kwargs == {"access_token": "runtime-token", "approved": True}\n        order.append("c6")\n        return sentinel\n\n    monkeypatch.setattr(publication, "verify_publication_package", fake_verify)\n    monkeypatch.setattr(publication, "_execute_manual_delivery", fake_execute)\n\n    result = publication._authorize_and_execute_manual_delivery(\n        service,\n        "project-c9",\n        publication.ManualPublicationPlatform.YOUTUBE,\n        publication.OAuthPlatform.YOUTUBE,\n        approved=True,\n        oauth_authorize=fake_authorize,\n    )\n\n    assert result is sentinel\n    assert order == ["verify", "oauth", "c6"]\n\n\ndef test_product_oauth_flow_blocks_before_verify_and_browser_without_approval(monkeypatch):\n    calls = []\n    service = SimpleNamespace(store=object())\n\n    monkeypatch.setattr(\n        publication,\n        "verify_publication_package",\n        lambda *args, **kwargs: calls.append("verify"),\n    )\n\n    def fake_authorize(*args, **kwargs):\n        calls.append("oauth")\n        return SimpleNamespace(token=SimpleNamespace(access_token="unused"))\n\n    try:\n        publication._authorize_and_execute_manual_delivery(\n            service,\n            "project-c9",\n            publication.ManualPublicationPlatform.TIKTOK,\n            publication.OAuthPlatform.TIKTOK,\n            approved=False,\n            oauth_authorize=fake_authorize,\n        )\n    except Exception as exc:\n        assert getattr(exc, "code", "") == "human_approval_required"\n    else:\n        raise AssertionError("missing approval must fail closed")\n\n    assert calls == []\n'''
          product_tests.write_text(product_text, encoding="utf-8")
          PY
      - name: Validate reconciled C9
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.11
          uv run --no-sync pytest -q \
            test/services/test_social_oauth_desktop.py \
            test/services/test_social_oauth.py \
            test/services/test_product_manual_publication_ui.py \
            test/services/test_social_publication.py \
            test/services/test_manual_publication.py
          uv run --no-sync ruff check \
            app/services/social_oauth_desktop.py \
            webui/product/publication.py \
            test/services/test_social_oauth_desktop.py \
            test/services/test_product_manual_publication_ui.py
          uv run --no-sync python -m py_compile \
            app/services/social_oauth_desktop.py \
            webui/product/publication.py
      - name: Commit only reconciled C9 production and tests
        shell: bash
        run: |
          set -euo pipefail
          git add \
            app/services/social_oauth_desktop.py \
            test/services/test_social_oauth_desktop.py \
            test/services/test_product_manual_publication_ui.py
          mapfile -t files < <(git diff --cached --name-only)
          test "${#files[@]}" -le 3
          for file in "${files[@]}"; do
            case "$file" in
              app/services/social_oauth_desktop.py|test/services/test_social_oauth_desktop.py|test/services/test_product_manual_publication_ui.py) ;;
              *) echo "unexpected staged file: $file" >&2; exit 1 ;;
            esac
          done
          if test "${#files[@]}" -eq 0; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "auth: close loopback before token exchange"
          git push origin HEAD:centinela-engineering/c05-c9-product-oauth-manual-publication-v0.1
