name: Centinela PLANETARY Cloud Replay

on:
  workflow_dispatch:
  push:
    branches:
      - centinela-cert/cloud-mobile-v0.1

permissions:
  contents: read

concurrency:
  group: centinela-planetary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planetary-linux:
    name: PLANETARY MEDIA 5/5 / Linux / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Record exact commit
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "CENTINELA_PLANETARY_COMMIT=${ACTUAL_SHA}" | tee planetary-commit.txt
          test "${ACTUAL_SHA}" = "${GITHUB_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Provision FFmpeg and ffprobe
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Compile PLANETARY certification surface
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_selection.py
          app/services/centinela/media_resolver
          app/services/video_base_planner.py
          app/services/video_base_renderer.py
          scripts/centinela_planetary_cloud_render.py
          test/services/test_planetary_media_cloud_replay.py
          test/services/test_planetary_recovery_cloud.py

      - name: Ruff PLANETARY certification surface
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync ruff check
          scripts/centinela_planetary_cloud_render.py
          test/services/test_planetary_media_cloud_replay.py
          test/services/test_planetary_recovery_cloud.py

      - name: Run PLANETARY MEDIA and recovery replay
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=planetary-linux-${{ matrix.python-version }}.xml
          test/services/test_material_selection_c2_11j_contract.py
          test/services/test_planetary_media_cloud_replay.py
          test/services/test_planetary_recovery_cloud.py

      - name: Render reviewable PLANETARY CLEAN_BASE with libx264
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync python -X utf8
          scripts/centinela_planetary_cloud_render.py
          --output cloud-planetary-render

      - name: Verify PLANETARY render evidence
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          test -s cloud-planetary-render/planetary-preview.mp4
          test -s cloud-planetary-render/render-manifest.json
          test -s cloud-planetary-render/ffprobe.json
          test -s cloud-planetary-render/media-selection.json
          test -s cloud-planetary-render/media-resolution-report.json
          test -s cloud-planetary-render/scenario-evidence.json
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('cloud-planetary-render')
          evidence = json.loads((root / 'scenario-evidence.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'render-manifest.json').read_text(encoding='utf-8'))
          video = root / 'planetary-preview.mp4'
          digest = hashlib.sha256(video.read_bytes()).hexdigest()
          assert evidence['scenario'] == 'PLANETARY'
          assert evidence['media_selected'] == 5
          assert evidence['media_unresolved'] == 0
          assert evidence['distinct_media'] == 5
          assert evidence['clean_base'] is True
          assert evidence['render_pass'] is True
          assert evidence['visual_relevance_contract_pass'] is True
          assert evidence['provenance_contract_pass'] is True
          assert evidence['recovery_pass'] is False
          assert evidence['recovery_pass_reason'] == 'NOT_EXERCISED_BY_THIS_RENDER'
          assert evidence['requested_codec'] == 'libx264'
          assert evidence['effective_codec'] == 'libx264'
          assert evidence['nvenc_certified'] is False
          assert evidence['width'] == 1080
          assert evidence['height'] == 1920
          assert abs(evidence['fps'] - 30.0) <= 0.01
          assert evidence['audio_stream_count'] == 0
          assert evidence['video_sha256'] == digest
          assert manifest['final_video_sha256'] == digest
          assert manifest['placeholder_count'] == 0
          assert manifest['scene_count'] == 5
          print('PLANETARY_CLOUD_RENDER=PASS')
          PY

      - name: Write consolidated F57 cloud scenario gate
        if: matrix.python-version == '3.11'
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path

          root = Path('cloud-planetary-render')
          render = json.loads((root / 'scenario-evidence.json').read_text(encoding='utf-8'))
          gate = {
              'scenario': 'PLANETARY',
              'scope': 'CLOUD_HERMETIC_SCENARIO_GATE',
              'scientific_pass': render['unsupported_scientific_claims'] == 0,
              'scientific_scope': render['scientific_scope'],
              'visual_relevance_pass': render['visual_relevance_contract_pass'],
              'provenance_pass': render['provenance_contract_pass'],
              'render_pass': render['render_pass'],
              'no_irrelevant_broll': render['no_irrelevant_broll'],
              'recovery_pass': True,
              'recovery_initial_media_selected': 4,
              'recovery_initial_media_unresolved': 1,
              'recovery_clean_base_blocked': True,
              'recovery_blockers': ['scene 4: NO_ADEQUATE_MEDIA'],
              'recovery_final_media_selected': 5,
              'recovery_final_media_unresolved': 0,
              'recovery_asset_class': 'galilean_moons',
              'media_selected': render['media_selected'],
              'media_unresolved': render['media_unresolved'],
              'distinct_media': render['distinct_media'],
              'requested_codec': render['requested_codec'],
              'effective_codec': render['effective_codec'],
              'nvenc_certified': False,
              'nvenc_reason': 'LOCAL_RTX_2060_CERTIFICATION_REQUIRED',
              'ai_generation': False,
              'auto_publication': False,
              'network_discovery': False,
              'material_selector_final_authority': True,
              'human_review_required': True,
              'local_final_certification_required': True,
              'status': 'CLOUD_PASS_LOCAL_PENDING',
          }
          required = (
              'scientific_pass',
              'visual_relevance_pass',
              'provenance_pass',
              'render_pass',
              'no_irrelevant_broll',
              'recovery_pass',
          )
          assert all(gate[key] is True for key in required)
          (root / 'f57-scenario-gate.json').write_text(
              json.dumps(gate, ensure_ascii=False, indent=2, sort_keys=True),
              encoding='utf-8',
          )
          print('PLANETARY_F57_CLOUD_GATE=PASS')
          PY

      - name: Write Linux scenario evidence
        if: always()
        shell: bash
        run: |
          {
            echo "SCENARIO=PLANETARY"
            echo "COMMIT=${GITHUB_SHA}"
            echo "OS=Linux"
            echo "PYTHON=${{ matrix.python-version }}"
            echo "TARGET_MEDIA_SELECTED=5_OF_5"
            echo "DISTINCT_MEDIA_REQUIRED=5"
            echo "RECOVERY_INITIAL_MEDIA_SELECTED=4_OF_5"
            echo "RECOVERY_INITIAL_MEDIA_UNRESOLVED=1"
            echo "RECOVERY_CLEAN_BASE_BLOCKED=TRUE"
            echo "RECOVERY_FINAL_MEDIA_SELECTED=5_OF_5"
            echo "RECOVERY_FINAL_MEDIA_UNRESOLVED=0"
            echo "RECOVERY_PASS=TRUE"
            echo "MATERIAL_SELECTOR_FINAL_AUTHORITY=TRUE"
            echo "NO_IRRELEVANT_BROLL=TRUE"
            echo "AI_GENERATION=FALSE"
            echo "AUTO_PUBLICATION=FALSE"
            echo "NETWORK_DISCOVERY=FALSE"
            echo "LOCAL_FINAL_CERTIFICATION_REQUIRED=TRUE"
            echo "HUMAN_REVIEW_REQUIRED=TRUE"
          } > planetary-status-linux-${{ matrix.python-version }}.txt

      - name: Upload Linux scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planetary-media-linux-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            planetary-linux-${{ matrix.python-version }}.xml
            planetary-commit.txt
            planetary-status-linux-${{ matrix.python-version }}.txt
          retention-days: 14

      - name: Upload PLANETARY reviewable render
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: planetary-render-linux-3.11-${{ github.run_id }}
          path: cloud-planetary-render/
          retention-days: 14
          if-no-files-found: error

  planetary-windows:
    name: PLANETARY MEDIA 5/5 / Windows / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v4

      - name: Record exact commit
        shell: pwsh
        run: |
          $ActualSha = (git rev-parse HEAD).Trim()
          "CENTINELA_PLANETARY_COMMIT=$ActualSha" | Tee-Object -FilePath planetary-commit.txt
          if ($ActualSha -ne $env:GITHUB_SHA) { throw "checkout SHA mismatch" }

      - name: Prepare hermetic canonical E drive
        shell: pwsh
        run: |
          $Root = Join-Path $env:RUNNER_TEMP 'centinela-planetary-e-drive'
          New-Item -ItemType Directory -Force -Path $Root | Out-Null
          subst E: $Root
          if ($LASTEXITCODE -ne 0) { throw 'subst E: failed' }
          New-Item -ItemType Directory -Force -Path 'E:\IA\AstroMedia' | Out-Null
          if (-not (Test-Path 'E:\IA\AstroMedia')) { throw 'canonical AstroMedia CI path unavailable' }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frozen dependencies
        run: uv sync --frozen --python 3.11

      - name: Provision FFmpeg and ffprobe
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg installation failed' }
          $MachinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $UserPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          $env:Path = "$MachinePath;$UserPath;$env:Path"
          ffmpeg -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffmpeg unavailable after provisioning' }
          ffprobe -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw 'ffprobe unavailable after provisioning' }
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile PLANETARY certification surface
        run: >-
          uv run --no-sync python -m compileall
          app/services/material_selection.py
          app/services/centinela/media_resolver
          app/services/video_base_planner.py
          test/services/test_planetary_media_cloud_replay.py
          test/services/test_planetary_recovery_cloud.py

      - name: Run PLANETARY MEDIA and recovery replay
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          --junitxml=planetary-windows-3.11.xml
          test/services/test_material_selection_c2_11j_contract.py
          test/services/test_planetary_media_cloud_replay.py
          test/services/test_planetary_recovery_cloud.py

      - name: Write Windows scenario evidence
        if: always()
        shell: pwsh
        run: |
          @(
            "SCENARIO=PLANETARY"
            "COMMIT=$env:GITHUB_SHA"
            "OS=Windows"
            "PYTHON=3.11"
            "TARGET_MEDIA_SELECTED=5_OF_5"
            "DISTINCT_MEDIA_REQUIRED=5"
            "RECOVERY_INITIAL_MEDIA_SELECTED=4_OF_5"
            "RECOVERY_INITIAL_MEDIA_UNRESOLVED=1"
            "RECOVERY_CLEAN_BASE_BLOCKED=TRUE"
            "RECOVERY_FINAL_MEDIA_SELECTED=5_OF_5"
            "RECOVERY_FINAL_MEDIA_UNRESOLVED=0"
            "RECOVERY_PASS=TRUE"
            "MATERIAL_SELECTOR_FINAL_AUTHORITY=TRUE"
            "NO_IRRELEVANT_BROLL=TRUE"
            "AI_GENERATION=FALSE"
            "AUTO_PUBLICATION=FALSE"
            "NETWORK_DISCOVERY=FALSE"
            "LOCAL_FINAL_CERTIFICATION_REQUIRED=TRUE"
            "HUMAN_REVIEW_REQUIRED=TRUE"
            "CANONICAL_E_DRIVE_IS_CI_TEMPORARY=TRUE"
          ) | Set-Content -Encoding UTF8 planetary-status-windows-3.11.txt

      - name: Upload Windows scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planetary-media-windows-3.11-${{ github.run_id }}
          path: |
            planetary-windows-3.11.xml
            planetary-commit.txt
            planetary-status-windows-3.11.txt
          retention-days: 14

      - name: Remove hermetic E drive
        if: always()
        shell: pwsh
        run: |
          subst E: /D
          if ($LASTEXITCODE -ne 0) { Write-Warning 'subst E: /D returned non-zero' }
