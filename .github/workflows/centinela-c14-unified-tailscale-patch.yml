name: Centinela C14 Unified Tailscale Patch

on:
  push:
    branches:
      - centinela-engineering/c05-c14-instagram-unified-tailscale-funnel-v0.1

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out C14
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.10"
          enable-cache: false
      - name: Reuse Tailscale Funnel for Instagram media transport
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          callback = Path("app/services/instagram_oauth_callback.py")
          text = callback.read_text(encoding="utf-8")

          old = '''        local_port: int,\n        redirect_uri: str,\n        executable: str | None = None,\n'''
          new = '''        local_port: int,\n        redirect_uri: str | None = None,\n        executable: str | None = None,\n'''
          if old not in text:
              raise SystemExit("callback signature anchor missing")
          text = text.replace(old, new, 1)

          old = '''        self.local_port = int(local_port)\n        self.redirect_uri = validate_tailscale_instagram_redirect_uri(redirect_uri)\n        self.host = (urlsplit(self.redirect_uri).hostname or "").lower()\n        self.executable = executable or shutil.which("tailscale") or ""\n'''
          new = '''        self.local_port = int(local_port)\n        self.redirect_uri = (\n            validate_tailscale_instagram_redirect_uri(redirect_uri)\n            if redirect_uri is not None\n            else ""\n        )\n        self.host = (urlsplit(self.redirect_uri).hostname or "").lower() if self.redirect_uri else ""\n        self.executable = executable or shutil.which("tailscale") or ""\n'''
          if old not in text:
              raise SystemExit("callback init anchor missing")
          text = text.replace(old, new, 1)

          old = '''        self.command_timeout_seconds = command_timeout_seconds\n        self._active = False\n\n    def _run(self, args: list[str]) -> CliResult:\n'''
          new = '''        self.command_timeout_seconds = command_timeout_seconds\n        self._active = False\n\n    @property\n    def public_origin(self) -> str:\n        return f"https://{self.host}" if self.host else ""\n\n    def _run(self, args: list[str]) -> CliResult:\n'''
          if old not in text:
              raise SystemExit("callback property anchor missing")
          text = text.replace(old, new, 1)

          old = '''        if dns_name != self.host:\n            raise _error(\n                "tailscale_dns_identity_mismatch",\n                ErrorCategory.VALIDATION,\n                "El hostname del redirect de Instagram no coincide con este nodo Tailscale.",\n                operation="instagram_oauth_callback.tailscale_preflight",\n            )\n\n        existing = _funnel_handler(self._funnel_status(), host=self.host)\n'''
          new = '''        if not dns_name or not dns_name.endswith(".ts.net"):\n            raise _error(\n                "tailscale_dns_identity_missing",\n                ErrorCategory.VALIDATION,\n                "Tailscale no devolvió un hostname *.ts.net verificable para este nodo.",\n                operation="instagram_oauth_callback.tailscale_preflight",\n            )\n        if self.host and dns_name != self.host:\n            raise _error(\n                "tailscale_dns_identity_mismatch",\n                ErrorCategory.VALIDATION,\n                "El hostname del redirect de Instagram no coincide con este nodo Tailscale.",\n                operation="instagram_oauth_callback.tailscale_preflight",\n            )\n        if not self.host:\n            self.host = dns_name\n\n        existing = _funnel_handler(self._funnel_status(), host=self.host)\n'''
          if old not in text:
              raise SystemExit("callback preflight anchor missing")
          text = text.replace(old, new, 1)
          callback.write_text(text, encoding="utf-8")

          transport = Path("app/services/instagram_ephemeral_https.py")
          text = transport.read_text(encoding="utf-8")

          old = '''from app.services.error_control import (\n    CentinelaError,\n    ErrorCategory,\n    boundary_error,\n    validate_local_media_file,\n)\nfrom app.services.social_publication import InstagramAdapter, SocialResult\n'''
          new = '''from app.services.error_control import (\n    CentinelaError,\n    ErrorCategory,\n    boundary_error,\n    validate_local_media_file,\n)\nfrom app.services.instagram_oauth_callback import TailscaleFunnelBridge\nfrom app.services.social_publication import InstagramAdapter, SocialResult\n'''
          if old not in text:
              raise SystemExit("transport import anchor missing")
          text = text.replace(old, new, 1)

          old = '''class InstagramTunnelProvider(StrEnum):\n    CLOUDFLARE_QUICK = "cloudflare_quick"\n    ZROK_PUBLIC = "zrok_public"\n'''
          new = '''class InstagramTunnelProvider(StrEnum):\n    TAILSCALE_FUNNEL = "tailscale_funnel"\n    CLOUDFLARE_QUICK = "cloudflare_quick"\n    ZROK_PUBLIC = "zrok_public"\n'''
          if old not in text:
              raise SystemExit("provider enum anchor missing")
          text = text.replace(old, new, 1)

          old = '''_PROVIDER_FACTS: dict[InstagramTunnelProvider, TunnelProviderFacts] = {\n    InstagramTunnelProvider.CLOUDFLARE_QUICK: TunnelProviderFacts(\n'''
          new = '''_PROVIDER_FACTS: dict[InstagramTunnelProvider, TunnelProviderFacts] = {\n    InstagramTunnelProvider.TAILSCALE_FUNNEL: TunnelProviderFacts(\n        provider=InstagramTunnelProvider.TAILSCALE_FUNNEL,\n        executable_candidates=("tailscale",),\n        allowed_hostname_suffixes=(".ts.net",),\n        classification="FREEMIUM (cliente OSS; control plane/relay hospedado)",\n        software_license="BSD-3-Clause (cliente tailscale/tailscale)",\n        hosted_service="Tailscale Funnel",\n        cost="0 € en plan Personal vigente, sujeto a límites/condiciones del servicio",\n        conclusion="MANTENER",\n        caveat=(\n            "Proveedor preferido para unificar OAuth + MP4; queda pendiente certificar "\n            "en el PC el fetch real de Meta y el ciclo Funnel 443."\n        ),\n    ),\n    InstagramTunnelProvider.CLOUDFLARE_QUICK: TunnelProviderFacts(\n'''
          if old not in text:
              raise SystemExit("provider facts anchor missing")
          text = text.replace(old, new, 1)

          old = '''    for provider in (\n        InstagramTunnelProvider.CLOUDFLARE_QUICK,\n        InstagramTunnelProvider.ZROK_PUBLIC,\n    ):\n'''
          new = '''    for provider in (\n        InstagramTunnelProvider.TAILSCALE_FUNNEL,\n        InstagramTunnelProvider.CLOUDFLARE_QUICK,\n        InstagramTunnelProvider.ZROK_PUBLIC,\n    ):\n'''
          if old not in text:
              raise SystemExit("audit order anchor missing")
          text = text.replace(old, new, 1)

          old = '''class EphemeralTunnel(AbstractContextManager["EphemeralTunnel"]):\n    provider: InstagramTunnelProvider\n    local_origin: str\n    startup_timeout_seconds: float = _DEFAULT_STARTUP_TIMEOUT_SECONDS\n    process_factory: ProcessFactory = subprocess.Popen\n    executable: str = ""\n    public_origin: str = ""\n    _process: TunnelProcess | None = field(default=None, init=False, repr=False)\n'''
          new = '''class EphemeralTunnel(AbstractContextManager["EphemeralTunnel"]):\n    provider: InstagramTunnelProvider\n    local_origin: str\n    startup_timeout_seconds: float = _DEFAULT_STARTUP_TIMEOUT_SECONDS\n    process_factory: ProcessFactory = subprocess.Popen\n    executable: str = ""\n    public_origin: str = ""\n    tailscale_bridge_factory: Callable[..., TailscaleFunnelBridge] = TailscaleFunnelBridge\n    _process: TunnelProcess | None = field(default=None, init=False, repr=False)\n    _tailscale_bridge: TailscaleFunnelBridge | None = field(default=None, init=False, repr=False)\n'''
          if old not in text:
              raise SystemExit("tunnel dataclass anchor missing")
          text = text.replace(old, new, 1)

          old = '''        if self.provider == InstagramTunnelProvider.CLOUDFLARE_QUICK:\n            return [\n'''
          new = '''        if self.provider == InstagramTunnelProvider.TAILSCALE_FUNNEL:\n            return [\n                executable,\n                "funnel",\n                "--https=443",\n                self.local_origin,\n            ]\n        if self.provider == InstagramTunnelProvider.CLOUDFLARE_QUICK:\n            return [\n'''
          if old not in text:
              raise SystemExit("tunnel command anchor missing")
          text = text.replace(old, new, 1)

          old = '''    def __enter__(self) -> "EphemeralTunnel":\n        if self.startup_timeout_seconds <= 0:\n            raise ValueError("startup_timeout_seconds must be positive")\n        executable = self._resolve_executable()\n'''
          new = '''    def __enter__(self) -> "EphemeralTunnel":\n        if self.startup_timeout_seconds <= 0:\n            raise ValueError("startup_timeout_seconds must be positive")\n        if self.provider == InstagramTunnelProvider.TAILSCALE_FUNNEL:\n            split = urlsplit(self.local_origin)\n            if split.scheme != "http" or split.hostname != _LOOPBACK_HOST or split.port is None:\n                raise _error(\n                    "instagram_tunnel_local_origin_invalid",\n                    "El túnel solo puede apuntar al servidor local 127.0.0.1.",\n                )\n            bridge = self.tailscale_bridge_factory(local_port=split.port)\n            try:\n                bridge.start()\n                accepted = self._accepted_public_origin(bridge.public_origin)\n                if accepted is None:\n                    raise _error(\n                        "instagram_tailscale_public_origin_invalid",\n                        "Tailscale no devolvió un origen HTTPS *.ts.net verificable.",\n                        category=ErrorCategory.UPSTREAM,\n                    )\n            except Exception:\n                try:\n                    bridge.stop()\n                except Exception:\n                    pass\n                raise\n            self._tailscale_bridge = bridge\n            self.public_origin = accepted\n            return self\n        executable = self._resolve_executable()\n'''
          if old not in text:
              raise SystemExit("tunnel enter anchor missing")
          text = text.replace(old, new, 1)

          old = '''    def close(self) -> None:\n        process = self._process\n        self._process = None\n        if process is None:\n            return\n'''
          new = '''    def close(self) -> None:\n        bridge = self._tailscale_bridge\n        if bridge is not None:\n            bridge.stop()\n            self._tailscale_bridge = None\n            self.public_origin = ""\n            return\n        process = self._process\n        self._process = None\n        if process is None:\n            return\n'''
          if old not in text:
              raise SystemExit("tunnel close anchor missing")
          text = text.replace(old, new, 1)
          transport.write_text(text, encoding="utf-8")

          callback_test = Path("test/services/test_instagram_oauth_callback.py")
          text = callback_test.read_text(encoding="utf-8")
          anchor = '''def test_tailscale_bridge_refuses_to_overwrite_existing_443_funnel():\n'''
          extra = '''def test_tailscale_bridge_can_derive_self_dns_for_media_transport():\n    runner = _TailscaleRunner()\n    bridge = TailscaleFunnelBridge(\n        local_port=43123,\n        executable="tailscale",\n        runner=runner,\n    )\n\n    bridge.start()\n    assert bridge.public_origin == "https://centinela.tail123456.ts.net"\n    assert runner.proxy == "http://127.0.0.1:43123"\n    bridge.stop()\n    assert runner.active is False\n\n\n'''
          if anchor not in text:
              raise SystemExit("callback test insertion anchor missing")
          text = text.replace(anchor, extra + anchor, 1)
          callback_test.write_text(text, encoding="utf-8")

          transport_test = Path("test/services/test_instagram_ephemeral_https.py")
          text = transport_test.read_text(encoding="utf-8")
          old = '''    assert [row["provider"] for row in rows] == [\n        "cloudflare_quick",\n        "zrok_public",\n    ]\n    assert rows[0]["software_license"] == "Apache-2.0"\n    assert "propietario" in rows[0]["classification"].lower()\n    assert rows[1]["classification"] == "OPEN SOURCE + 100 % GRATUITA"\n    assert all(row["conclusion"] == "PRUEBA A/B" for row in rows)\n'''
          new = '''    assert [row["provider"] for row in rows] == [\n        "tailscale_funnel",\n        "cloudflare_quick",\n        "zrok_public",\n    ]\n    assert rows[0]["software_license"].startswith("BSD-3-Clause")\n    assert rows[0]["classification"].startswith("FREEMIUM")\n    assert rows[0]["conclusion"] == "MANTENER"\n    assert rows[1]["software_license"] == "Apache-2.0"\n    assert "propietario" in rows[1]["classification"].lower()\n    assert rows[2]["classification"] == "OPEN SOURCE + 100 % GRATUITA"\n    assert rows[1]["conclusion"] == rows[2]["conclusion"] == "PRUEBA A/B"\n'''
          if old not in text:
              raise SystemExit("transport audit test anchor missing")
          text = text.replace(old, new, 1)

          old = '''def test_tunnel_commands_and_hostname_allowlists_are_fail_closed():\n    cloudflare = EphemeralTunnel(\n'''
          new = '''def test_tunnel_commands_and_hostname_allowlists_are_fail_closed():\n    tailscale = EphemeralTunnel(\n        InstagramTunnelProvider.TAILSCALE_FUNNEL,\n        "http://127.0.0.1:43122",\n    )\n    assert tailscale._command("tailscale") == [\n        "tailscale",\n        "funnel",\n        "--https=443",\n        "http://127.0.0.1:43122",\n    ]\n    assert (\n        tailscale._accepted_public_origin("https://centinela.tail123456.ts.net")\n        == "https://centinela.tail123456.ts.net"\n    )\n    assert (\n        tailscale._accepted_public_origin("https://centinela.tail123456.ts.net.evil.example")\n        is None\n    )\n\n    cloudflare = EphemeralTunnel(\n'''
          if old not in text:
              raise SystemExit("transport command test anchor missing")
          text = text.replace(old, new, 1)

          anchor = '''class _FakeResponse:\n'''
          extra = '''class _FakeTailscaleBridge:\n    def __init__(self):\n        self.public_origin = "https://centinela.tail123456.ts.net"\n        self.started = False\n        self.stopped = False\n\n    def start(self):\n        self.started = True\n\n    def stop(self):\n        self.stopped = True\n\n\ndef test_tailscale_ephemeral_tunnel_reuses_certified_bridge_and_cleans_up():\n    bridge = _FakeTailscaleBridge()\n    tunnel = EphemeralTunnel(\n        InstagramTunnelProvider.TAILSCALE_FUNNEL,\n        "http://127.0.0.1:43125",\n        tailscale_bridge_factory=lambda **kwargs: bridge,\n    )\n    with tunnel as active:\n        assert active.public_origin == "https://centinela.tail123456.ts.net"\n        assert bridge.started is True\n        assert bridge.stopped is False\n    assert bridge.stopped is True\n    assert tunnel.public_origin == ""\n\n\n'''
          if anchor not in text:
              raise SystemExit("transport bridge test insertion anchor missing")
          text = text.replace(anchor, extra + anchor, 1)

          anchor = '''def test_remote_transport_rejects_untrusted_host_and_changed_bytes(tmp_path):\n'''
          extra = '''def test_remote_transport_accepts_verified_tailscale_origin(tmp_path):\n    _, payload, sha256 = _write_mp4(tmp_path)\n    evidence = _validate_remote_transport(\n        public_url=(\n            "https://centinela.tail123456.ts.net/"\n            "opaque/social_1080x1920.mp4"\n        ),\n        provider=InstagramTunnelProvider.TAILSCALE_FUNNEL,\n        expected_sha256=sha256,\n        expected_size=len(payload),\n        public_path_sha256="e" * 64,\n        session=_RemoteSession(payload),\n    )\n    assert evidence.provider == InstagramTunnelProvider.TAILSCALE_FUNNEL\n    assert evidence.public_origin == "https://centinela.tail123456.ts.net"\n    assert evidence.remote_media_sha256 == sha256\n\n\n'''
          if anchor not in text:
              raise SystemExit("transport remote test insertion anchor missing")
          text = text.replace(anchor, extra + anchor, 1)
          transport_test.write_text(text, encoding="utf-8")
          PY
      - name: Validate focused C14 stack
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --group dev --python 3.11
          uv run --python 3.11 pytest -q \
            test/services/test_instagram_ephemeral_https.py \
            test/services/test_instagram_oauth_callback.py \
            test/services/test_instagram_oauth.py \
            test/services/test_instagram_manual_publication.py \
            test/services/test_product_instagram_manual_publication_ui.py
          uv run --python 3.11 ruff check \
            app/services/instagram_ephemeral_https.py \
            app/services/instagram_oauth_callback.py \
            test/services/test_instagram_ephemeral_https.py \
            test/services/test_instagram_oauth_callback.py
          uv run --python 3.11 python -m py_compile \
            app/services/instagram_ephemeral_https.py \
            app/services/instagram_oauth_callback.py
      - name: Commit only C14 functional changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/services/instagram_ephemeral_https.py \
            app/services/instagram_oauth_callback.py \
            test/services/test_instagram_ephemeral_https.py \
            test/services/test_instagram_oauth_callback.py
          git diff --cached --quiet && exit 0
          test "$(git diff --cached --name-only | tr '\n' ' ')" = "app/services/instagram_ephemeral_https.py app/services/instagram_oauth_callback.py test/services/test_instagram_ephemeral_https.py test/services/test_instagram_oauth_callback.py "
          git commit -m "instagram: unify media transport on Tailscale Funnel"
          git push
